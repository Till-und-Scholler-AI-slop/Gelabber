[workspace]
resolver = "3"
members = ["api", "media", "shared"]

[workspace.package]
version = "0.13.1"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
gelabber-shared = { path = "shared" }

# The tests hash passwords and decode images by the hundred; unoptimized, an
# Argon2 hash with the production parameters took 417 ms instead of 16 ms.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
