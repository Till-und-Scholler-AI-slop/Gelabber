server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # Behind the proxy a redirect must not name this container's scheme or port.
    absolute_redirect off;

    # text/html is always included. rnnoise.wasm barely shrinks and stays out.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The app shell names the hashed files of one build. `/` and the SPA
    # fallback below both end here by internal redirect, so every document
    # response is revalidated and a new deployment is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output. A missing file is a 404, never the app shell: an old
    # shell asking for a removed chunk must fail visibly instead of receiving
    # HTML as a script. Without `always` the header stays off that 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        try_files $uri =404;
    }

    location /audio/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
