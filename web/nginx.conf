# The origin of MinIO's public endpoint, for the fetch directives of the
# shell's Content-Security-Policy (below). The image's entrypoint writes it
# from MINIO_PUBLIC_ENDPOINT, the value the API signs upload and attachment
# links with (docker-entrypoint.d/40-gelabber-storage-origin.sh). A container
# without it, such as one an image-only update keeps from an older Compose
# file, or this file mounted on its own, has no such file: the origin stays
# empty and so do the fetch directives, so nothing the policy cannot know
# about is blocked.
map "" $gelabber_storage_origin {
    default "";
    include /etc/nginx/gelabber/*.map;
}

# With the origin: everything from this origin, MinIO for uploads (presigned
# PUT) and attachments (the API redirects there), data: and blob: for call
# sounds, the favicon badge, upload previews and microphone test clips, any
# https host for link avatars (profile.rs takes an https URL), and the 0.8.x
# Tauri app's IPC on ipc: (Linux) and http://ipc.localhost (Windows), for its
# own scripts: update banner and native video. 'self' covers the gateway's and the media WebSocket. Styles stay
# inline as before: the shell has an inline <style>, and style-src would
# otherwise fall back to default-src.
# With ATTACHMENT_DELIVERY=proxy the entrypoint writes 'self' instead of an
# origin: uploads and attachments go through the API on this origin (#348),
# so the policy names no storage host at all.
map $gelabber_storage_origin $gelabber_fetch_directives {
    "" "";
    "'self'" "; default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; img-src 'self' data: blob: https:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'";
    default "; default-src 'self'; connect-src 'self' $gelabber_storage_origin ipc: http://ipc.localhost; img-src 'self' data: blob: https: $gelabber_storage_origin; media-src 'self' data: blob: $gelabber_storage_origin; style-src 'self' 'unsafe-inline'";
}

# The public landing page at / (#522). The entrypoint writes the landing map
# (docker-entrypoint.d/50-gelabber-public-pages.sh) only while
# GELABBER_LANDING=true and the page exists. It sits in a subfolder, so the
# storage map's include above never reads it. Without it, as on every
# self-hosted instance by default, / stays the app shell and so sign-in.
map "" $gelabber_landing {
    default 0;
    include /etc/nginx/gelabber/public/*.map;
}

# The session cookie is httpOnly but reaches nginx: a visitor who has one gets
# the app, even an expired one, which then goes to sign-in as before.
map $cookie_gelabber_session $gelabber_signed_out {
    "" 1;
    default 0;
}

# German when the browser lists German first, otherwise English.
map $http_accept_language $gelabber_public_lang {
    default en;
    "~*^\s*de" de;
}

# Where / goes: the landing page for a signed-out visitor without a query
# string, the app shell for everyone else.
map "$gelabber_landing$gelabber_signed_out$is_args" $gelabber_front {
    default /index.html;
    "11" /$gelabber_public_lang/;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # Behind the proxy a redirect must not name this container's scheme or port.
    absolute_redirect off;

    # text/html is always included. rnnoise.wasm barely shrinks and stays out.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;

    # Every location repeats the same security headers: nginx drops all
    # inherited add_header lines in a block that has one of its own, so a copy
    # at server level would vanish from each location below. They are written
    # out, not included, so this file still works when it is mounted on its
    # own. Permissions-Policy names only features the app never uses. Never
    # add camera, microphone, display-capture, speaker-selection or clipboard
    # (voice and chat use them), nor autoplay, fullscreen, picture-in-picture
    # or encrypted-media (the YouTube embed is given them).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    # The app shell names the hashed files of one build. `/` and the SPA
    # fallback below both end here by internal redirect, so no browser keeps a
    # document response and every load gets the shell of the current deployment.
    # `no-cache` is not enough: a browser takes a stored copy without asking
    # when it restores a tab, reloads a discarded one or goes back, and the old
    # shell's hashed files are still in its cache.
    #
    # The Content-Security-Policy sits on the shell alone: every page of the
    # app is this document (offline.html is static and has inline scripts of
    # its own). The hash pins the inline bootstrap script in index.html;
    # src/pwa/nginx.test.mjs checks it against the file. 'wasm-unsafe-eval'
    # lets RNNoise compile. The fetch directives (default-src, connect-src,
    # img-src, media-src, style-src) come from the maps above and only once
    # the MinIO origin is known (deploy/README.md).
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval' 'sha256-Ymhy9okZfEMbRFjgkub854NfFwTSwdNReGSoXDKUA3M='; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'$gelabber_fetch_directives" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
    }

    # Hashed build output. A missing file is a 404, never the app shell: an old
    # shell asking for a removed chunk must fail visibly instead of receiving
    # HTML as a script. Without `always` the header stays off that 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    # Unhashed files keep their names across releases: icons and artwork for a
    # day, the RNNoise worklet and wasm revalidated so they match the build.
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location /audio/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri $uri/ /index.html;
    }

    # `/` ends in the app shell as before (`location = /index.html`), or in the
    # landing page for a signed-out visitor while it is on (the maps above).
    # The headers apply only should the rewrite itself fail.
    location = / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        rewrite ^ $gelabber_front last;
    }

    # The landing and legal pages the entrypoint writes at start (#522): static
    # HTML without any script, so their policy allows none. A page that was
    # not published is the app's not-found page, as any unknown path. `/`
    # also ends here, so caches keep its two answers apart (Vary).
    location ^~ /de/ {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files ${uri}index.html $uri.html /index.html;
    }

    location ^~ /en/ {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files ${uri}index.html $uri.html /index.html;
    }

    # The feedback form (#542) posts to /api/public/feedback on this origin:
    # the same block as above, with form-action 'self'.
    location ^~ /de/feedback {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files ${uri}index.html $uri.html /index.html;
    }

    location ^~ /en/feedback {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files ${uri}index.html $uri.html /index.html;
    }

    # What this instance published, written at start. Missing when the
    # entrypoint never ran: the clients then show no legal links.
    location = /public-pages.json {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/public-pages;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    # The build's unfilled templates, which only the entrypoint reads.
    location ^~ /public-pages/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        return 404;
    }
}
