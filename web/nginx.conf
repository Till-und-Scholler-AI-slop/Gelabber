server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # Behind the proxy a redirect must not name this container's scheme or port.
    absolute_redirect off;

    # text/html is always included. rnnoise.wasm barely shrinks and stays out.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json text/plain;

    # Every location repeats the same security headers: nginx drops all
    # inherited add_header lines in a block that has one of its own, so a copy
    # at server level would vanish from each location below. They are written
    # out, not included, so this file still works when it is mounted on its
    # own. Permissions-Policy names only features the app never uses. Never
    # add camera, microphone, display-capture, speaker-selection or clipboard
    # (voice and chat use them), nor autoplay, fullscreen, picture-in-picture
    # or encrypted-media (the YouTube embed is given them).
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location = /offline.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    # The app shell names the hashed files of one build. `/` and the SPA
    # fallback below both end here by internal redirect, so no browser keeps a
    # document response and every load gets the shell of the current deployment.
    # `no-cache` is not enough: a browser takes a stored copy without asking
    # when it restores a tab, reloads a discarded one or goes back, and the old
    # shell's hashed files are still in its cache.
    #
    # The Content-Security-Policy is about scripts only and sits on the shell
    # alone: every page of the app is this document (offline.html is static
    # and has inline scripts of its own). The hash pins the inline theme
    # bootstrap in index.html; src/pwa/nginx.test.mjs checks it against the
    # file. 'wasm-unsafe-eval' lets RNNoise compile. Fetch directives
    # (default-src, connect-src, img-src, media-src) are left out on purpose:
    # uploads and attachments go to the MinIO origin, link avatars to any
    # https host, and the desktop app reaches its native part through ipc: and
    # http://ipc.localhost (deploy/README.md).
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval' 'sha256-5+khEwdlJD//ZwaJZn8zAF/1XxlavEQLLIX43LDGxuc='; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
    }

    # Hashed build output. A missing file is a 404, never the app shell: an old
    # shell asking for a removed chunk must fail visibly instead of receiving
    # HTML as a script. Without `always` the header stays off that 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location /audio/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location /images/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=()" always;
        try_files $uri $uri/ /index.html;
    }
}
