<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="%theme.dark.background%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gelabber" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- use-credentials: without it a browser asks for the manifest without
         cookies, and an access proxy in front answers with its login page. -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <script>
      // The interface language before the first paint: the one this device
      // last showed, else the browser's first German or English, else
      // English (detectLocale in src/i18n/locale.ts). The splash shows the
      // texts whose lang matches; i18n/startup.ts carries the choice on.
      let locale = null;
      try {
        locale = localStorage.getItem("gelabber.locale");
      } catch {
        // Blocked storage: the browser's languages decide.
      }
      if (locale !== "de" && locale !== "en") {
        locale = "en";
        for (const tag of navigator.languages ?? [navigator.language ?? ""]) {
          const primary = String(tag).trim().toLowerCase().split(/[-_]/)[0];
          if (primary === "de" || primary === "en") {
            locale = primary;
            break;
          }
        }
      }
      document.documentElement.lang = locale;
      // The entry bundle failed to load or run before the first render: say
      // so instead of "Verbinde…" for ever. Load errors do not bubble.
      window.addEventListener(
        "error",
        (event) => {
          if (
            event instanceof ErrorEvent ||
            event.target instanceof HTMLScriptElement
          )
            document
              .querySelector(".boot-splash")
              ?.setAttribute("data-failed", "");
        },
        true,
      );
      const setInitialColours = (background, text) => {
        document.documentElement.style.setProperty("--lr-bg", background);
        document.documentElement.style.setProperty("--lr-text", text);
        // The browser and system bars around the app take the page colour.
        // theme/theme.ts keeps this in step once the app runs.
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", background);
      };
      const setInitialTheme = (dark) => {
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        // Filled in from src/theme/defaults.json at build time (vite.config.ts).
        setInitialColours(
          dark ? "%theme.dark.background%" : "%theme.light.background%",
          dark ? "%theme.dark.text%" : "%theme.light.text%",
        );
      };
      try {
        const stored = localStorage.getItem("gelabber.theme");
        const preference =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "dark";
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        setInitialTheme(dark);
        // Only the minimal, validated paint colours are needed before the app loads.
        // Full theme validation and system-mode handling live in theme/startup.ts.
        const cache = JSON.parse(
          localStorage.getItem("gelabber.theme.paint") ?? "null",
        );
        const paint = cache?.theme ?? cache;
        if (cache?.system === true) {
          setInitialTheme(matchMedia("(prefers-color-scheme: dark)").matches);
        } else if (
          paint?.version === 1 &&
          ["light", "dark"].includes(paint.mode) &&
          /^#[0-9a-f]{6}$/i.test(paint.colors?.background) &&
          /^#[0-9a-f]{6}$/i.test(paint.colors?.text)
        ) {
          setInitialTheme(paint.mode === "dark");
          setInitialColours(paint.colors.background, paint.colors.text);
        }
      } catch {
        setInitialTheme(true);
      }
    </script>
    <style>
      html {
        background: var(--lr-bg, %theme.dark.background%);
        color: var(--lr-text, %theme.dark.text%);
      }
      /* Shown until React's first render replaces it. */
      .boot-splash {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        min-height: 100dvh;
        background: var(--lr-bg);
        color: var(--lr-text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .boot-splash img {
        border-radius: 12px;
      }
      .boot-splash strong {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .boot-splash-status {
        color: color-mix(in srgb, var(--lr-text) 68%, var(--lr-bg));
        font-size: 13px;
        opacity: 0;
        animation: boot-splash-in 240ms ease-out 600ms forwards;
      }
      /* Both languages are in the markup; the one <html lang> names shows. */
      html:not([lang="en"]) .boot-splash [lang="en"],
      html[lang="en"] .boot-splash [lang="de"] {
        display: none;
      }
      .boot-splash p {
        display: none;
        margin: 0;
        font-size: 14px;
        text-align: center;
      }
      .boot-splash a {
        color: inherit;
        font-weight: 600;
      }
      .boot-splash[data-failed] .boot-splash-status {
        display: none;
      }
      .boot-splash[data-failed] p {
        display: block;
      }
      @keyframes boot-splash-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-status {
          opacity: 1;
          animation: none;
        }
      }
    </style>
    <title>Gelabber</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/icons/icon-192.png" width="48" height="48" alt="" />
        <strong>Gelabber</strong>
        <span class="boot-splash-status">
          <span lang="de">Verbinde…</span>
          <span lang="en">Connecting…</span>
        </span>
        <p role="alert">
          <span lang="de">
            Gelabber konnte nicht geladen werden.
            <a href="">Seite neu laden</a>
          </span>
          <span lang="en">
            Gelabber could not be loaded.
            <a href="">Reload page</a>
          </span>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
