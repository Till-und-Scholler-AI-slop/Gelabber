<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191a" />
    <title>Keine Verbindung · Gelabber</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #17191a;
        color: #eef0ee;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.75rem;
      }
      p {
        line-height: 1.6;
        color: #a4abb1;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.2rem;
        border-radius: 7px;
        background: #f3b752;
        color: #191b1b;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #eef0ee;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Gelabber</p>
      <h1>Gerade keine Verbindung</h1>
      <p>
        Für Nachrichten und Gespräche brauchst du eine Internetverbindung.
        Sobald du wieder online bist, kannst du Gelabber erneut öffnen.
      </p>
      <a href="/">Erneut verbinden</a>
    </main>
  </body>
</html>
