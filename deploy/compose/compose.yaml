name: gelabber

# One Compose file, one reverse proxy (Caddy). coturn and the SFU bind
# their own UDP — never through Caddy. No LiveKit, no product SFU.

services:
  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "${GELABBER_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - media
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-gelabber}:${POSTGRES_PASSWORD:-gelabber}@postgres:5432/${POSTGRES_DB:-gelabber}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gelabbergelabber}
      MINIO_BUCKET: ${MINIO_BUCKET:-gelabber}
      TURN_URLS: stun:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478},turn:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478}
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:-gelabberturn}
      MEDIA_TICKET_TTL_SECS: "30"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  media:
    build:
      context: ../..
      dockerfile: media/Dockerfile
    environment:
      MEDIA_ADDR: 0.0.0.0:8081
      REDIS_URL: redis://redis:6379
      MEDIA_ICE_BIND: 0.0.0.0:10000
      MEDIA_ICE_PORT_MAX: "10031"
      MEDIA_ADVERTISED_IP: ${MEDIA_ADVERTISED_IP:-127.0.0.1}
      TURN_URLS: stun:coturn:3478,turn:coturn:3478
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:-gelabberturn}
    expose:
      - "8081"
    ports:
      - "10000-10031:10000-10031/udp"
    depends_on:
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
    restart: unless-stopped

  # UDP/TCP 3478 + relay range. Not behind Caddy.
  coturn:
    image: coturn/coturn:4.18.0
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-gelabber}:${TURN_PASSWORD:-gelabberturn}
      - --realm=${TURN_REALM:-gelabber.local}
      # coturn 4.18.0: CLI and DTLS are off by default (`--cli` / `--dtls`
      # turn them on). `--no-cli` is an error; `--no-dtls` is unknown.
      - --no-tls
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gelabber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gelabber}
      POSTGRES_DB: ${POSTGRES_DB:-gelabber}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Pulled from GHCR. build.tags (gelabber/minio:…) is only applied on a local
  # source-build fallback if the pull misses or is denied.
  minio:
    image: ghcr.io/till-und-scholler-ai-slop/gelabber/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: missing
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      tags:
        - gelabber/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gelabbergelabber}
      # Browser PUTs the presigned upload from the web origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Optional: `docker compose --profile observability up`
  # Scrapes api:8080/metrics and media:8081/metrics on the compose network.
  # Not published through Caddy. No LiveKit, no APM SaaS.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - media
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-gelabber}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
