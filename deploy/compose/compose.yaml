name: gelabber

# Product stack for one operator. UDP (coturn + SFU ICE) is not on Caddy.
# No LiveKit. Existing host Caddy: see compose.homelab.yaml.
# Defaults serve this machine only (plain HTTP on 127.0.0.1); for other
# machines put TLS in front (deploy/README.md). Passwords have no defaults.

services:
  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "${GELABBER_HTTP_BIND:-127.0.0.1}:${GELABBER_HTTP_PORT:-80}:80"
    environment:
      # Proxies whose X-Forwarded-For Caddy believes. No colon: an empty
      # value in .env trusts none (deploy/README.md, "Client addresses").
      GELABBER_TRUSTED_PROXIES: ${GELABBER_TRUSTED_PROXIES-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - media
    restart: unless-stopped

  web:
    image: ${GELABBER_WEB_IMAGE:-ghcr.io/till-und-scholler-ai-slop/gelabber/web:v0.8.7}
    pull_policy: missing
    build:
      context: ../../web
      dockerfile: Dockerfile
      tags:
        - gelabber/web:v0.8.7
    environment:
      # The same values as the API's: the app shell's Content-Security-Policy
      # allows uploads and attachments on this origin only (#288), or on the
      # app's own origin with ATTACHMENT_DELIVERY=proxy (#348).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      ATTACHMENT_DELIVERY: ${ATTACHMENT_DELIVERY:-redirect}
    expose:
      - "80"
    restart: unless-stopped

  api:
    image: ${GELABBER_API_IMAGE:-ghcr.io/till-und-scholler-ai-slop/gelabber/api:v0.8.7}
    pull_policy: missing
    build:
      context: ../..
      dockerfile: api/Dockerfile
      tags:
        - gelabber/api:v0.8.7
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-gelabber}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see deploy/README.md)}@postgres:5432/${POSTGRES_DB:-gelabber}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Bucket-scoped user from minio-init, never the MinIO root (#196).
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:-gelabber-api}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env (see deploy/README.md)}
      MINIO_BUCKET: ${MINIO_BUCKET:-gelabber}
      # redirect: browsers load and upload at MINIO_PUBLIC_ENDPOINT. proxy:
      # through the API on the app's origin, MinIO stays internal (#348).
      ATTACHMENT_DELIVERY: ${ATTACHMENT_DELIVERY:-redirect}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      # Empty keeps the API defaults: 30 days absolute, 14 days idle.
      API_SESSION_TTL_HOURS: ${API_SESSION_TTL_HOURS:-}
      API_SESSION_IDLE_HOURS: ${API_SESSION_IDLE_HOURS:-}
      # One API process; keep it well below Postgres max_connections (100).
      API_DB_MAX_CONNECTIONS: ${API_DB_MAX_CONNECTIONS:-20}
      TURN_URLS: ${TURN_URLS:-stun:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478},turn:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478}?transport=udp,turn:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478}?transport=tcp}
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:?set TURN_PASSWORD in .env (see deploy/README.md)}
      # Empty keeps static TURN credentials. Set a private secret (same value
      # on coturn) to mint REST credentials. gelabberturnsecret is rejected.
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      TURN_CRED_TTL_SECS: ${TURN_CRED_TTL_SECS:-21600}
      MEDIA_TICKET_TTL_SECS: "30"
      # Empty turns GIF search off. The key never reaches a browser.
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      KLIPY_CONTENT_FILTER: ${KLIPY_CONTENT_FILTER:-medium}
      KLIPY_CACHE_SECS: ${KLIPY_CACHE_SECS:-600}
      API_RATE_GIF_PER_MIN: ${API_RATE_GIF_PER_MIN:-30}
      API_RATE_GIF_MEDIA_PER_MIN: ${API_RATE_GIF_MEDIA_PER_MIN:-240}
      # Empty turns Web Push off.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Empty: the push services of Chrome, Firefox, Edge/Windows and Safari.
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      # Empty SMTP_HOST turns account mail (confirmation, password reset) off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Link previews: the API fetches linked pages (public addresses only).
      API_LINK_PREVIEWS: ${API_LINK_PREVIEWS:-true}
      API_LINK_PREVIEW_DENY_HOSTS: ${API_LINK_PREVIEW_DENY_HOSTS:-}
      API_RATE_PREVIEW_PER_MIN: ${API_RATE_PREVIEW_PER_MIN:-10}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  media:
    image: ${GELABBER_MEDIA_IMAGE:-ghcr.io/till-und-scholler-ai-slop/gelabber/media:v0.8.7}
    pull_policy: missing
    build:
      context: ../..
      dockerfile: media/Dockerfile
      tags:
        - gelabber/media:v0.8.7
    environment:
      MEDIA_ADDR: 0.0.0.0:8081
      REDIS_URL: redis://redis:6379
      MEDIA_ICE_BIND: 0.0.0.0:10000
      # One UDP port per worker: worker i binds 10000 + i, so the published
      # range must reach 10000 + MEDIA_WORKERS - 1 (the media service checks).
      MEDIA_WORKERS: ${MEDIA_WORKERS:-1}
      MEDIA_ICE_PORT_MAX: ${MEDIA_ICE_PORT_MAX:-10000}
      MEDIA_ADVERTISED_IP: ${MEDIA_ADVERTISED_IP:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8081"
    ports:
      - "10000-${MEDIA_ICE_PORT_MAX:-10000}:10000-${MEDIA_ICE_PORT_MAX:-10000}/udp"
    depends_on:
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
        required: false
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.18.0
    # coturn 4.18.0: CLI/DTLS off by default. `--no-cli` errors; `--no-dtls` unknown.
    # Static `--lt-cred-mech` unless TURN_AUTH_SECRET is a private shared secret.
    environment:
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:?set TURN_PASSWORD in .env (see deploy/README.md)}
      TURN_REALM: ${TURN_REALM:-gelabber.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
      TURN_RELAY_MIN: ${TURN_RELAY_MIN:-49160}
      TURN_RELAY_MAX: ${TURN_RELAY_MAX:-49200}
    volumes:
      - ./coturn-entry.sh:/coturn-entry.sh:ro
    entrypoint: ["/bin/sh", "/coturn-entry.sh"]
    ports:
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/udp"
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}:${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}/udp"
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gelabber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see deploy/README.md)}
      POSTGRES_DB: ${POSTGRES_DB:-gelabber}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${GELABBER_MINIO_IMAGE:-ghcr.io/till-und-scholler-ai-slop/gelabber/minio:RELEASE.2025-10-15T17-29-55Z}
    pull_policy: missing
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      tags:
        - gelabber/minio:v0.2.4
        - gelabber/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see deploy/README.md)}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Creates the bucket and the API's MinIO user, then exits. Runs on every
  # `up`; re-applies policy and password, never touches objects.
  minio-init:
    image: ${GELABBER_MC_IMAGE:-ghcr.io/till-und-scholler-ai-slop/gelabber/mc:RELEASE.2025-08-13T08-35-41Z}
    pull_policy: missing
    build:
      context: ./mc
      dockerfile: Dockerfile
      args:
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
      tags:
        - gelabber/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (see deploy/README.md)}
      MINIO_BUCKET: ${MINIO_BUCKET:-gelabber}
      MINIO_APP_USER: ${MINIO_APP_USER:-gelabber-api}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD in .env (see deploy/README.md)}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  minio_data:
