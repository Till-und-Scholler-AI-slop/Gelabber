name: gelabber

# Product stack for one operator. UDP (coturn + SFU ICE) is not on Caddy.
# No LiveKit. Existing host Caddy: see compose.homelab.yaml.

services:
  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "${GELABBER_HTTP_BIND:-0.0.0.0}:${GELABBER_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - media
    restart: unless-stopped

  web:
    image: ghcr.io/till-und-scholler-ai-slop/gelabber/web:v0.1.1
    pull_policy: missing
    build:
      context: ../../web
      dockerfile: Dockerfile
      tags:
        - gelabber/web:v0.1.1
    expose:
      - "80"
    restart: unless-stopped

  api:
    image: ghcr.io/till-und-scholler-ai-slop/gelabber/api:v0.1.1
    pull_policy: missing
    build:
      context: ../..
      dockerfile: api/Dockerfile
      tags:
        - gelabber/api:v0.1.1
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-gelabber}:${POSTGRES_PASSWORD:-gelabber}@postgres:5432/${POSTGRES_DB:-gelabber}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gelabbergelabber}
      MINIO_BUCKET: ${MINIO_BUCKET:-gelabber}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      TURN_URLS: ${TURN_URLS:-stun:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478},turn:${TURN_PUBLIC_HOST:-127.0.0.1}:${TURN_PORT:-3478}}
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:-gelabberturn}
      MEDIA_TICKET_TTL_SECS: "30"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  media:
    image: ghcr.io/till-und-scholler-ai-slop/gelabber/media:v0.1.1
    pull_policy: missing
    build:
      context: ../..
      dockerfile: media/Dockerfile
      tags:
        - gelabber/media:v0.1.1
    environment:
      MEDIA_ADDR: 0.0.0.0:8081
      REDIS_URL: redis://redis:6379
      MEDIA_ICE_BIND: 0.0.0.0:10000
      MEDIA_ICE_PORT_MAX: "10031"
      MEDIA_ADVERTISED_IP: ${MEDIA_ADVERTISED_IP:-127.0.0.1}
      TURN_URLS: ${MEDIA_TURN_URLS:-stun:coturn:3478,turn:coturn:3478}
      TURN_USERNAME: ${TURN_USERNAME:-gelabber}
      TURN_PASSWORD: ${TURN_PASSWORD:-gelabberturn}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8081"
    ports:
      - "10000-10031:10000-10031/udp"
    depends_on:
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
        required: false
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.18.0
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=${TURN_RELAY_MIN:-49160}
      - --max-port=${TURN_RELAY_MAX:-49200}
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-gelabber}:${TURN_PASSWORD:-gelabberturn}
      - --realm=${TURN_REALM:-gelabber.local}
      # coturn 4.18.0: CLI/DTLS off by default. `--no-cli` errors; `--no-dtls` unknown.
      - --no-tls
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/udp"
      - "${TURN_BIND:-0.0.0.0}:${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}:${TURN_RELAY_MIN:-49160}-${TURN_RELAY_MAX:-49200}/udp"
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gelabber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gelabber}
      POSTGRES_DB: ${POSTGRES_DB:-gelabber}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ghcr.io/till-und-scholler-ai-slop/gelabber/minio:v0.1.1
    pull_policy: missing
    build:
      context: ./minio
      dockerfile: Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
      tags:
        - gelabber/minio:v0.1.1
        - gelabber/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gelabber}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gelabbergelabber}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
