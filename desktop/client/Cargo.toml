[package]
name = "gelabber-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber native client core: REST, gateway and state, without UI"
publish = false

[dependencies]
gelabber-i18n = { path = "../i18n" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls", "stream", "multipart"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The sockets verify certificates as reqwest does: against the platform's trust store.
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7.1"
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
thiserror = "2"
parking_lot = "0.12.5"
tracing = "0.1"
url = "2"
# Sign-in through a provider (oidc.rs): the PKCE pair and the app's state.
rand = "0.10.3"
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"

[dev-dependencies]
gelabber-i18n = { path = "../i18n", features = ["testing"] }
