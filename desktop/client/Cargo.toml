[package]
name = "gelabber-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber native client core: REST, gateway and state, without UI"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls", "stream", "multipart"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
thiserror = "2"
parking_lot = "0.12.5"
tracing = "0.1"
url = "2"
