# Desktop client workspace, separate from the server workspace: building it
# needs the native libwebrtc package (see native/README in desktop/README.md).
[workspace]
resolver = "3"
members = ["core", "client", "call", "ui", "gelabber", "parity"]

[workspace.package]
version = "0.8.10"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
