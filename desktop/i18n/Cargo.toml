[package]
name = "gelabber-i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber native string catalogs: German and English, the interface's language, locale-bound formatting"
publish = false

[features]
# `on_this_thread`, a language of the calling thread's own: for tests only.
testing = []

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }
