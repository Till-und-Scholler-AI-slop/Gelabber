[package]
name = "gelabber-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber native desktop interface (egui)"
publish = false

[features]
# Real calls through the native media core (see desktop/call).
media = ["gelabber-call/media"]

[dependencies]
gelabber-client = { path = "../client" }
gelabber-call = { path = "../call" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "wayland", "x11"] }
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.27.0", features = ["serde"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
egui_system_font_provider = "0.37.0"
tracing = "0.1"
resvg = { version = "0.45.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
# Update checks (src/platform/update.rs): the signature format of desktop/app.
minisign-verify = "0.3.0"
base64 = "0.22.1"
semver = "1.0.28"

# Notifications, tray and push-to-talk portal on the session bus, in pure
# Rust: the zbus eframe's accessibility already brings.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

# Toasts, tray and the push-to-talk hook, as desktop/app has them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
tray-icon = { version = "0.25.1", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe"] }
