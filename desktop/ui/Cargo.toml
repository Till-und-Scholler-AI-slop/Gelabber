[package]
name = "gelabber-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber native desktop interface (egui)"
publish = false

[features]
# Real calls through the native media core (see desktop/call).
media = ["gelabber-call/media"]

[dependencies]
gelabber-client = { path = "../client" }
gelabber-call = { path = "../call" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "clipboard", "wayland", "x11"] }
egui = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.27.0", features = ["serde"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
egui_system_font_provider = "0.37.0"
# The system faces of terminal themes and the setup screen (fonts.rs), the
# lookup egui_system_font_provider already uses.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
tracing = "0.1"
resvg = { version = "0.45.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
# Updates (src/platform/update.rs): the Tauri updater's signature format.
minisign-verify = "0.3.0"
base64 = "0.23.1"
semver = "1.0.28"
# The setup screen's update check runs without a server's client and its runtime.
tokio = { version = "1.53.2", features = ["rt"] }

# Notifications, tray and push-to-talk portal on the session bus, in pure
# Rust: the zbus eframe's accessibility already brings.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
# The Tauri app's WebKitGTK localStorage (src/platform/webview/webkit.rs);
# bundled, so the package needs no libsqlite3 of its own.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# Toasts, tray, the push-to-talk hook and the update's installer, as the Tauri app had them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
tray-icon = { version = "0.25.1", default-features = false }

[dev-dependencies]
gelabber-call = { path = "../call", features = ["testing"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe"] }

# Against the seeded stack with the native media core (see its header).
[[test]]
name = "voice_live"
required-features = ["media"]
