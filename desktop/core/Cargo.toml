[package]
name = "gelabber-media-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber desktop media core: safe Rust over libmediasoupclient + libwebrtc"
publish = false
# Lets dependents read the library directory (DEP_GELABBER_MEDIA_LIB_DIR).
links = "gelabber_media"

[dependencies]
serde_json = "1.0.151"
thiserror = "2"
# The "strong" microphone filter (GEL-28): DeepFilterNet3 through libDF and
# tract, at the commit docs/v0.13-deepfilternet-measurement.md measured.
# "default-model" embeds that commit's models/DeepFilterNet3_onnx.tar.gz.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15.6"

[build-dependencies]
cmake = "0.1.54"

[dev-dependencies]
mediasoup = "=0.33.2"
gelabber-testing = { path = "../testing" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
