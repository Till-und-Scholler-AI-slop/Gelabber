[package]
name = "gelabber-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber media gateway: own signaling and authority, mediasoup engine"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
mediasoup = "=0.29.0"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
rand = "0.10.2"
gelabber-shared.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake"] }
