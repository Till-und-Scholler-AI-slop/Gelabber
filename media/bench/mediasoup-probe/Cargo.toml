[package]
name = "gelabber-mediasoup-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

# Isolate evaluation-only dependencies from the production workspace and lock.
[workspace]

[dependencies]
mediasoup = "=0.29.0"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
strip = true
