[package]
name = "gelabber-current-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false
[workspace]
[dependencies]
gelabber-media = { path = "../.." }
gelabber-shared = { path = "../../../shared" }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
[profile.release]
strip = true
