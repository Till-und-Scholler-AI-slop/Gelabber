[package]
name = "gelabber-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gelabber HTTP API (Axum, sqlx/Postgres, Redis, JSON tracing)"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# Persistence is locked to sqlx 0.9.0 for v1 (issue #2). No second ORM, no query-builder mix.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "derive", "uuid", "chrono"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Password hashing (issue #3): Argon2id via RustCrypto, PHC string format.
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1.26.1", features = ["serde"] }
rand = "0.10.2"
sha2 = "0.11.0"
subtle = "2.6.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
