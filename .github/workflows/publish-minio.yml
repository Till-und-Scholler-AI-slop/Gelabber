# Pushes the pinned MinIO CE server and mc images, built and checked by
# minio-images.yml, to GHCR from main when a tag is missing. New org packages
# start private; a maintainer sets them Public once in the UI.
name: Publish MinIO CE image

on:
  push:
    branches: [main]
    paths:
      - deploy/compose/minio/**
      - deploy/compose/mc/**
      - .github/workflows/publish-minio.yml
      - .github/workflows/minio-images.yml
  workflow_dispatch:

concurrency:
  group: minio-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: MinIO images
    uses: ./.github/workflows/minio-images.yml
    with:
      keep: ${{ github.ref == 'refs/heads/main' }}

  # Its own job: only this one holds the packages token, the build above ran
  # fetched Go modules. Push only from main (includes workflow_dispatch on main).
  publish:
    needs: images
    if: github.ref == 'refs/heads/main' && needs.images.outputs.built == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      MINIO_RELEASE: ${{ needs.images.outputs.minio-release }}
      MC_RELEASE: ${{ needs.images.outputs.mc-release }}
    steps:
      - name: Image names
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=ghcr.io/${repo}/minio" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=gelabber/minio" >> "$GITHUB_ENV"
          echo "GHCR_MC_IMAGE=ghcr.io/${repo}/mc" >> "$GITHUB_ENV"
          echo "LOCAL_MC_IMAGE=gelabber/mc" >> "$GITHUB_ENV"

      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minio-images

      - name: Load the images
        run: |
          set -euo pipefail
          docker load -i minio-images.tar
          docker image inspect "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${LOCAL_MC_IMAGE}:${MC_RELEASE}" > /dev/null

      # For `docker buildx imagetools inspect` below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          set -euo pipefail
          # Never replace the pinned source build. Registry/auth errors fail closed.
          if docker buildx imagetools inspect "${GHCR_IMAGE}:${MINIO_RELEASE}" > /tmp/minio-existing 2>/tmp/minio-error; then
            echo "Pinned MinIO image already exists; preserving it."
          elif grep -Fq 'manifest unknown' /tmp/minio-error || grep -Fxq "ERROR: ${GHCR_IMAGE}:${MINIO_RELEASE}: not found" /tmp/minio-error; then
            docker tag "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${GHCR_IMAGE}:${MINIO_RELEASE}"
            docker push "${GHCR_IMAGE}:${MINIO_RELEASE}"
          else
            cat /tmp/minio-error >&2
            exit 1
          fi
          if docker buildx imagetools inspect "${GHCR_MC_IMAGE}:${MC_RELEASE}" > /tmp/mc-existing 2>/tmp/mc-error; then
            echo "Pinned mc image already exists; preserving it."
          elif grep -Fq 'manifest unknown' /tmp/mc-error || grep -Fxq "ERROR: ${GHCR_MC_IMAGE}:${MC_RELEASE}: not found" /tmp/mc-error; then
            docker tag "${LOCAL_MC_IMAGE}:${MC_RELEASE}" "${GHCR_MC_IMAGE}:${MC_RELEASE}"
            docker push "${GHCR_MC_IMAGE}:${MC_RELEASE}"
          else
            cat /tmp/mc-error >&2
            exit 1
          fi

      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in minio mc; do
            encoded="gelabber%2F${package}"
            path="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${encoded}"
            vis="$(gh api "$path" --jq .visibility || true)"
            if [ "$vis" = "public" ]; then
              echo "GHCR package gelabber/${package} is public."
              continue
            fi
            echo "Current visibility of gelabber/${package}: ${vis:-unknown}. Setting public…"
            gh api --method PATCH "$path" -f visibility=public || true
            gh api --method PATCH "${path}/visibility" -f visibility=public || true
            vis="$(gh api "$path" --jq .visibility || true)"
            if [ "$vis" = "public" ]; then
              echo "GHCR package gelabber/${package} is public."
              continue
            fi
            echo "::warning::GHCR package gelabber/${package} is still ${vis:-unknown/private}. Fresh clones cannot pull until a maintainer sets it Public: https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${encoded} → Package settings → Change visibility → Public. Until then: docker login ghcr.io, or compose falls back to the source build."
          done
