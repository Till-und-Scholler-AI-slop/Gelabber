# Publish the pinned MinIO CE image so `docker compose up` can pull it.
# Source-only: deploy/compose/minio/Dockerfile (no FROM minio/minio).
# Org packages start private. PATCH visibility is attempted; GitHub returns
# 404 for org containers, so a maintainer must flip Public once in the UI.
name: Publish MinIO CE image

on:
  push:
    branches: [main]
    paths:
      - deploy/compose/minio/**
      - .github/workflows/publish-minio.yml
  pull_request:
    paths:
      - deploy/compose/minio/**
      - .github/workflows/publish-minio.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image names
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          ver="v$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml | head -n 1)"
          echo "GHCR_IMAGE=ghcr.io/${repo}/minio" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=gelabber/minio" >> "$GITHUB_ENV"
          echo "GELABBER_VERSION=${ver}" >> "$GITHUB_ENV"
          # Push only from main (includes workflow_dispatch on main).
          if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            echo "PUSH=true" >> "$GITHUB_ENV"
          else
            echo "PUSH=false" >> "$GITHUB_ENV"
          fi

      - name: Compose pin matches
        run: |
          set -euo pipefail
          grep -F "${GHCR_IMAGE}:${GELABBER_VERSION}" deploy/compose/compose.yaml
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ARG MINIO_RELEASE=${MINIO_RELEASE}" deploy/compose/minio/Dockerfile
          test "${GELABBER_VERSION}" = "v$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml | head -n 1)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: deploy/compose/minio
          file: deploy/compose/minio/Dockerfile
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          load: true
          provenance: false
          tags: gelabber/minio:${{ env.MINIO_RELEASE }}

      - name: Verify minio --version
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint /usr/bin/minio \
            "${LOCAL_IMAGE}:${MINIO_RELEASE}" --version)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "${MINIO_RELEASE}"

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.PUSH == 'true'
        run: |
          docker tag "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${GHCR_IMAGE}:${MINIO_RELEASE}"
          docker tag "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${GHCR_IMAGE}:${GELABBER_VERSION}"
          docker tag "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${MINIO_RELEASE}"
          docker push "${GHCR_IMAGE}:${GELABBER_VERSION}"
          docker push "${GHCR_IMAGE}:latest"

      - name: Make package public
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          encoded='gelabber%2Fminio'
          path="orgs/${{ github.repository_owner }}/packages/container/${encoded}"
          vis="$(gh api "$path" --jq .visibility || true)"
          if [ "$vis" = "public" ]; then
            echo "GHCR package gelabber/minio is public."
            exit 0
          fi
          echo "Current visibility: ${vis:-unknown}. Setting public…"
          gh api --method PATCH "$path" -f visibility=public || true
          gh api --method PATCH "${path}/visibility" -f visibility=public || true
          vis="$(gh api "$path" --jq .visibility || true)"
          if [ "$vis" = "public" ]; then
            echo "GHCR package gelabber/minio is public."
            exit 0
          fi
          echo "::warning::GHCR package gelabber/minio is still ${vis:-unknown/private}. Fresh clones cannot pull until a maintainer sets it Public: https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/gelabber%2Fminio → Package settings → Change visibility → Public. Until then: docker login ghcr.io, or compose falls back to the source build."

