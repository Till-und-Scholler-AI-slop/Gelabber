# Publish the pinned MinIO CE image so `docker compose up` can pull it.
# Source-only: deploy/compose/minio/Dockerfile (no FROM minio/minio).
name: Publish MinIO CE image

on:
  push:
    branches: [main]
    paths:
      - deploy/compose/minio/**
      - .github/workflows/publish-minio.yml
  pull_request:
    paths:
      - deploy/compose/minio/**
      - .github/workflows/publish-minio.yml
  workflow_dispatch:

env:
  MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image names
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR_IMAGE=ghcr.io/${repo}/minio" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=gelabber/minio" >> "$GITHUB_ENV"
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] \
            || [ '${{ github.ref }}' = 'refs/heads/main' ]; then
            echo "PUSH=true" >> "$GITHUB_ENV"
          else
            echo "PUSH=false" >> "$GITHUB_ENV"
          fi

      - name: Compose pin matches
        run: |
          set -euo pipefail
          grep -F "ghcr.io/till-und-scholler-ai-slop/gelabber/minio:${MINIO_RELEASE}" \
            deploy/compose/compose.yaml
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ARG MINIO_RELEASE=${MINIO_RELEASE}" deploy/compose/minio/Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: deploy/compose/minio
          file: deploy/compose/minio/Dockerfile
          build-args: |
            MINIO_RELEASE=${{ env.MINIO_RELEASE }}
          load: true
          provenance: false
          tags: gelabber/minio:${{ env.MINIO_RELEASE }}

      - name: Verify minio --version
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint /usr/bin/minio \
            "${LOCAL_IMAGE}:${MINIO_RELEASE}" --version)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "${MINIO_RELEASE}"

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.PUSH == 'true'
        run: |
          docker tag "${LOCAL_IMAGE}:${MINIO_RELEASE}" "${GHCR_IMAGE}:${MINIO_RELEASE}"
          docker push "${GHCR_IMAGE}:${MINIO_RELEASE}"

      - name: Make package public
        if: env.PUSH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          encoded='gelabber%2Fminio'
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "orgs/${{ github.repository_owner }}/packages/container/${encoded}/visibility" \
            -f visibility=public
