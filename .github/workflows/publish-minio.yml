# Pushes the pinned MinIO and mc images to GHCR from main: a missing tag, or one built
# from other sources than this commit's (GEL-402). New org packages start private.
name: Publish MinIO CE image

on:
  push:
    branches: [main]
    paths:
      - deploy/compose/minio/**
      - deploy/compose/mc/**
      - .github/workflows/publish-minio.yml
      - .github/workflows/minio-images.yml
  workflow_dispatch:

concurrency:
  group: minio-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Per image: push a missing tag, replace one whose source-tree label differs
  # from this commit's folder, keep the rest (minio_source.py).
  plan:
    name: What to publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      minio: ${{ steps.plan.outputs.minio }}
      mc: ${{ steps.plan.outputs.mc }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/minio_source.py plan | tee -a "$GITHUB_OUTPUT"

  images:
    name: MinIO images
    needs: plan
    uses: ./.github/workflows/minio-images.yml
    with:
      build: ${{ needs.plan.outputs.build == 'true' }}
      keep: ${{ github.ref == 'refs/heads/main' }}

  # Its own job: only this one holds the packages token, the build above ran
  # fetched Go modules. Push only from main (includes workflow_dispatch on main).
  publish:
    needs: [plan, images]
    if: github.ref == 'refs/heads/main' && needs.images.outputs.built == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      MINIO_RELEASE: ${{ needs.images.outputs.minio-release }}
      MC_RELEASE: ${{ needs.images.outputs.mc-release }}
      MINIO_ACTION: ${{ needs.plan.outputs.minio }}
      MC_ACTION: ${{ needs.plan.outputs.mc }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minio-images

      - name: Load the images
        run: |
          set -euo pipefail
          docker load -i minio-images.tar
          docker image inspect "gelabber/minio:${MINIO_RELEASE}" "gelabber/mc:${MC_RELEASE}" > /dev/null

      # For `docker buildx imagetools inspect` in minio_source.py.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: python3 .github/workflows/scripts/minio_source.py publish "$MINIO_ACTION" "$MC_ACTION"

      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in minio mc; do
            encoded="gelabber%2F${package}"
            path="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${encoded}"
            vis="$(gh api "$path" --jq .visibility || true)"
            if [ "$vis" = "public" ]; then
              echo "GHCR package gelabber/${package} is public."
              continue
            fi
            echo "Current visibility of gelabber/${package}: ${vis:-unknown}. Setting public…"
            gh api --method PATCH "$path" -f visibility=public || true
            gh api --method PATCH "${path}/visibility" -f visibility=public || true
            vis="$(gh api "$path" --jq .visibility || true)"
            if [ "$vis" = "public" ]; then
              echo "GHCR package gelabber/${package} is public."
              continue
            fi
            echo "::warning::GHCR package gelabber/${package} is still ${vis:-unknown/private}. Fresh clones cannot pull until a maintainer sets it Public: https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${encoded} → Package settings → Change visibility → Public. Until then: docker login ghcr.io, or compose falls back to the source build."
          done
