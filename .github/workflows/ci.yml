# Verify API, web, media, and deployment configuration.
# Compose/browser smoke tests run locally to keep Actions minutes bounded.
# No image push. No continue-on-error. Missing Postgres/Redis/MinIO fail the job.
name: CI

on:
  workflow_dispatch:
    inputs:
      extended_e2e:
        description: Run the extended browser and fault diagnostic matrix (strict results)
        type: boolean
        default: true
      verify_typing_stability:
        description: Require 20 consecutive isolated typing latency checks (no retries)
        type: boolean
        default: false
  pull_request:
    paths:
      - api/**
      - media/**
      - shared/**
      - web/**
      - docker/**
      - .dockerignore
      - deploy/compose/**
      # Operator advice that deploy/compose/tests reads (Caddy's Host header).
      - deploy/README.md
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      # Its version against the server's (deploy/compose/tests).
      - desktop/Cargo.toml
      - .github/workflows/**
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Build verified Debian native CI toolchain
        run: docker build --target base --file media/Dockerfile --tag gelabber-native-ci-toolchain:local .

      - name: Install native tools for separate Ubuntu fault diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-venv
          python3 - <<'PY'
          import json, subprocess
          commands = {"gcc": ["gcc", "--version"], "g++": ["g++", "--version"],
                      "python": ["python3", "--version"]}
          print(json.dumps({"scope": "Optional Ubuntu fault diagnostics; separate from verified Debian PR gate",
                            "versions": {name: subprocess.check_output(command, text=True).splitlines()[0]
                                         for name, command in commands.items()},
                            "packages": subprocess.check_output(["dpkg-query", "-W", "build-essential",
                                                                  "gcc", "g++", "python3", "python3-venv"],
                                                                 text=True).splitlines()}, indent=2))
          PY
          native_build_dir="${RUNNER_TEMP}/gelabber-native-build"
          python3 docker/mediasoup-build-tools.py --destination "$native_build_dir"
          python3 - "$native_build_dir" "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve()
          values = {"PYTHON": root / "native-python", "CARGO_BUILD_JOBS": "2", "PIP_NO_INDEX": "1",
                    "PIP_FIND_LINKS": root / "wheelhouse", "PIP_CONSTRAINT": root / "constraints.txt",
                    "MESON_VERSION": "1.12.0", "NINJA_VERSION": "1.13.2"}
          with open(sys.argv[2], "a") as output:
              output.writelines(f"{name}={value}\n" for name, value in values.items())
          PY

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies when a runtime assertion fails; checks
          # remain failing and every test is rerun on the next candidate.
          cache-on-failure: true
          shared-key: native-debian-${{ hashFiles('media/Dockerfile', 'docker/mediasoup-*', 'docker/install-mediasoup-debian-build-tools.sh') }}
          workspaces: . -> target/native-debian

      - name: Install Caddy
        run: |
          set -euo pipefail
          caddy_archive="$(mktemp)"
          trap 'rm -f "$caddy_archive"' EXIT
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz" -o "$caddy_archive"
          tar -xzf "$caddy_archive" -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy
          caddy version
          test "$(caddy version | cut -d ' ' -f 1)" = "v2.11.4"

      - name: Test deployment config
        run: python3 -m unittest discover -s deploy/compose/tests -v

      - name: Test workspace
        run: |
          set -euo pipefail
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null
          # Keep the 100ms latency assertion away from concurrent integration tests.
          # The skipped test is mandatory in the following isolated step.
          sh docker/run-native-ci.sh test --locked --workspace --all-targets --no-fail-fast -- --skip typing_broadcasts_fast_and_clears_on_stop --test-threads=4

      - name: Test typing latency in isolation
        env:
          VERIFY_TYPING_STABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_typing_stability }}
        run: |
          set -euo pipefail
          repetitions=1
          if [ "$VERIFY_TYPING_STABILITY" = true ]; then
            repetitions=20
          fi
          for ((iteration=1; iteration<=repetitions; iteration++)); do
            echo "Isolated typing latency check ${iteration}/${repetitions}"
            # Match workspace feature unification to reuse the already built tests.
            sh docker/run-native-ci.sh test --locked --workspace --all-targets typing_broadcasts_fast_and_clears_on_stop -- --exact --test-threads=1
          done

      - name: Build owned API and SFU for isolated fault acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: cargo build --locked -p gelabber-api -p gelabber-media

      - name: Node for owned core fault acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install real browsers and SQL fixture client
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm ci --prefix web
          cd web
          npx playwright install --with-deps chromium firefox

      - name: Prepare dedicated fault database, bucket and immutable API/SFU copies
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        env:
          GELABBER_E2E_PREPARE_MEDIA: "true"
        run: node web/scripts/e2e/ci-fault-prepare.mjs

      - name: Real app core and API/Redis Live-lease faults in both browsers
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: |
          set -euo pipefail
          failed=0
          for engine in chromium firefox; do
            for profile in core-faults media-faults; do
              owned_media_env="$GELABBER_E2E_MEDIA_FAULT_ENV"
              owned_media_manifest="$GELABBER_E2E_MEDIA_MANIFEST"
              if [ "$profile" = core-faults ]; then
                owned_media_env=
                owned_media_manifest=
              fi
              if ! GELABBER_E2E_MEDIA_FAULT_ENV="$owned_media_env" \
                GELABBER_E2E_MEDIA_MANIFEST="$owned_media_manifest" \
                GELABBER_E2E_BROWSER="$engine" GELABBER_E2E_PROFILE="$profile" \
                GELABBER_E2E_REPORT="/tmp/gelabber-e2e/${engine}-${profile}.json" \
                node web/scripts/e2e/fault-run.mjs; then
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Upload redacted owned fault results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-core-faults
          path: /tmp/gelabber-e2e/*.json
          if-no-files-found: warn

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify pinned emoji data
        run: python3 ../tools/generate-emoji-data.py --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test native E2E harness boundaries
        run: |
          npm run test:e2e-harness
          node scripts/e2e/rendered-frames.checks.mjs
          node scripts/e2e/media-probe.checks.mjs
          node scripts/e2e/publisher-encoders.checks.mjs
          node scripts/e2e/receive-loss-proxy.checks.mjs
          node scripts/e2e/browser-options.checks.mjs
          node scripts/e2e/native-evaluate.checks.mjs
          node --experimental-vm-modules scripts/e2e/access-native.checks.mjs
          node scripts/e2e/held-renderer.checks.mjs
          node --experimental-vm-modules scripts/e2e/native-finish.checks.mjs
          node --experimental-vm-modules scripts/e2e/media-extra.checks.mjs
          node scripts/smoke-netem.checks.mjs
          node scripts/e2e/faults.checks.mjs
          node --experimental-vm-modules scripts/e2e/teardown.checks.mjs
          node --experimental-vm-modules scripts/e2e/media-runtime.checks.mjs
          node --experimental-vm-modules scripts/e2e/ci-fault-prepare.checks.mjs
          node scripts/e2e/ci-fault-loop.checks.mjs

      - name: Build
        run: npm run build
