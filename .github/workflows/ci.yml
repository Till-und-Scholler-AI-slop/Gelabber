# PR gate: `changes` picks the areas a pull request touches and only their
# jobs run; ci-ok is the one required check. Pushes and manual runs run all.
name: CI

on:
  workflow_dispatch:
    inputs:
      verify_typing_stability:
        description: Require 20 consecutive isolated typing latency checks (no retries)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, "v[0-9]*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A re-run of an older run must not cancel the newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      desktop: ${{ steps.areas.outputs.desktop }}
      deploy: ${{ steps.areas.outputs.deploy }}
      minio: ${{ steps.areas.outputs.minio }}
      images: ${{ steps.areas.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request checks out its merge commit; the first parent is the base.
      # --no-renames lists a move's source too; quotePath=false leaves non-ASCII paths unquoted.
      - name: Areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD | python3 .github/workflows/scripts/changes.py >> "$GITHUB_OUTPUT"
          else
            python3 .github/workflows/scripts/changes.py --all >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      # Type check only: DOCS_RS makes mediasoup-sys skip its worker build.
      - name: Clippy
        env:
          DOCS_RS: "1"
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The media image's base stage; its layers come from the media image cache
      # that main writes, so most runs skip the apt and wheel downloads.
      - name: Build verified Debian native CI toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/media/Dockerfile
          target: base
          load: true
          provenance: false
          tags: gelabber-native-ci-toolchain:local
          cache-from: type=gha,scope=media

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Pushes save, pull requests only read: per-PR copies (~900 MB)
          # blew the cache quota.
          save-if: ${{ github.event_name == 'push' }}
          # The build runs in the Debian image (shared-key), so the runner's
          # own Rust versions must not change the key and drop the cache.
          add-rust-environment-hash-key: false
          shared-key: native-debian-${{ hashFiles('backend/media/Dockerfile', 'backend/build/mediasoup-*', 'backend/build/install-mediasoup-debian-build-tools.sh') }}
          workspaces: backend -> target/native-debian

      # Runs the test binaries side by side instead of one after another.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.149
          NEXTEST_SHA256: d65c7f14bcb5c1566d1ecd534c5da8dedb81ba58586e478b0ab81c877d2bd8ad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o "$archive"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Test workspace
        run: |
          set -euo pipefail
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null
          # The 100 ms typing assertion runs alone in the next step.
          sh backend/build/run-native-ci.sh nextest run --locked --workspace --all-targets --no-fail-fast \
            -E 'not test(typing_broadcasts_fast_and_clears_on_stop)'

      - name: Test typing latency in isolation
        env:
          VERIFY_TYPING_STABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_typing_stability }}
        run: |
          set -euo pipefail
          repetitions=1
          if [ "$VERIFY_TYPING_STABILITY" = true ]; then
            repetitions=20
          fi
          for ((iteration=1; iteration<=repetitions; iteration++)); do
            echo "Isolated typing latency check ${iteration}/${repetitions}"
            # Same flags as above, so the built tests are reused.
            sh backend/build/run-native-ci.sh test --locked --workspace --all-targets typing_broadcasts_fast_and_clears_on_stop -- --exact --test-threads=1
          done

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi

  deploy:
    name: Deploy config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Caddy
        run: |
          set -euo pipefail
          caddy_archive="$(mktemp)"
          trap 'rm -f "$caddy_archive"' EXIT
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz" -o "$caddy_archive"
          tar -xzf "$caddy_archive" -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy
          caddy version
          test "$(caddy version | cut -d ' ' -f 1)" = "v2.11.4"

      # Also checks that every workflow action is pinned to a commit SHA.
      - name: Test deployment config
        run: python3 -m unittest discover -s deploy/compose/tests -v

      # The restore drill runs by hand; its own unit tests run here.
      - name: Test deployment tools
        run: python3 -m unittest discover -s deploy/tools/tests -v

  web:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify pinned emoji data
        run: python3 scripts/generate-emoji-data.py --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test E2E harness and scripts
        run: npm run test:checks

      - name: Build
        run: npm run build

  # The app images a pull request touches, built without pushing;
  # publish-images.yml pushes them from main.
  images:
    name: Image ${{ matrix.name }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names and OCI metadata
        env:
          IMAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=ghcr.io/${repo}/${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "GELABBER_VERSION=v$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_ENV"
          echo "OCI_CREATED=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Compose version pins match workspace
        run: grep -F "${GHCR_IMAGE}:${GELABBER_VERSION}" deploy/compose/compose.yaml

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.name == 'media' }}
          provenance: false
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ env.GELABBER_VERSION }}
            OCI_CREATED=${{ env.OCI_CREATED }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          # Pull requests read the layer cache; main writes it.
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Verify actual media image readiness and normal shutdown
        if: matrix.name == 'media'
        run: python3 backend/build/check-media-image.py --image "${GHCR_IMAGE}:${IMAGE_TAG}" --revision "$GITHUB_SHA"

  # Builds and checks the pinned MinIO and mc images; pushes only from main.
  minio:
    name: MinIO images
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.minio == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-minio.yml

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # For its libwebrtc jobs, which store a new package in a release (pushes).
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-native.yml

  # The one required check: red if any job that ran failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, rust, web, deploy, images, minio, desktop]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
