# Verify API, web, and media: existing tests plus a Compose start smoke.
# No image push. No continue-on-error. Missing Postgres/Redis/MinIO fail the job.
name: CI

on:
  workflow_dispatch:
    inputs:
      extended_e2e:
        description: Run the extended browser and fault diagnostic matrix (strict results)
        type: boolean
        default: true
  pull_request:
    paths:
      - api/**
      - media/**
      - shared/**
      - web/**
      - docker/**
      - .dockerignore
      - deploy/compose/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/**
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Caddy
        run: |
          set -euo pipefail
          curl -fsSL "https://caddyserver.com/api/download?os=linux&arch=amd64&version=v2.11.4" -o /usr/local/bin/caddy
          chmod +x /usr/local/bin/caddy
          caddy version
          test "$(caddy version | cut -d ' ' -f 1)" = "v2.11.4"

      - name: Test deployment config
        run: python3 -m unittest discover -s deploy/compose/tests -v

      - name: Test workspace
        run: |
          set -euo pipefail
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null
          cargo test --locked --workspace --all-targets

      - name: Build owned API and SFU for isolated fault acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: cargo build --locked -p gelabber-api -p gelabber-media

      - name: Node for owned core fault acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install real browsers and SQL fixture client
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm ci --prefix web
          cd web
          npx playwright install --with-deps chromium firefox

      - name: Prepare dedicated fault database, bucket and immutable API/SFU copies
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        env:
          GELABBER_E2E_PREPARE_MEDIA: "true"
        run: node web/scripts/e2e/ci-fault-prepare.mjs

      - name: Real app core and API/Redis Live-lease faults in both browsers
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        run: |
          set -euo pipefail
          failed=0
          for engine in chromium firefox; do
            for profile in core-faults media-faults; do
              owned_media_env="$GELABBER_E2E_MEDIA_FAULT_ENV"
              owned_media_manifest="$GELABBER_E2E_MEDIA_MANIFEST"
              if [ "$profile" = core-faults ]; then
                owned_media_env=
                owned_media_manifest=
              fi
              if ! GELABBER_E2E_MEDIA_FAULT_ENV="$owned_media_env" \
                GELABBER_E2E_MEDIA_MANIFEST="$owned_media_manifest" \
                GELABBER_E2E_BROWSER="$engine" GELABBER_E2E_PROFILE="$profile" \
                GELABBER_E2E_REPORT="/tmp/gelabber-e2e/${engine}-${profile}.json" \
                node web/scripts/e2e/fault-run.mjs; then
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Upload redacted owned fault results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-core-faults
          path: /tmp/gelabber-e2e/*.json
          if-no-files-found: warn

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test native E2E harness boundaries
        run: |
          npm run test:e2e-harness
          node scripts/e2e/rendered-frames.checks.mjs
          node scripts/e2e/media-probe.checks.mjs
          node scripts/e2e/browser-options.checks.mjs
          node scripts/e2e/native-evaluate.checks.mjs
          node --experimental-vm-modules scripts/e2e/access-native.checks.mjs
          node --experimental-vm-modules scripts/e2e/native-finish.checks.mjs
          node --experimental-vm-modules scripts/e2e/media-extra.checks.mjs
          node scripts/smoke-netem.checks.mjs
          node scripts/e2e/faults.checks.mjs
          node --experimental-vm-modules scripts/e2e/teardown.checks.mjs
          node --experimental-vm-modules scripts/e2e/media-runtime.checks.mjs
          node --experimental-vm-modules scripts/e2e/ci-fault-prepare.checks.mjs
          node scripts/e2e/ci-fault-loop.checks.mjs

      - name: Build
        run: npm run build

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Env
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          cp .env.example .env
          # Firefox's native ICE path needs a real local IPv4, as in the
          # approved local runtime. This changes only this ephemeral CI stack.
          # No addresses or env contents are printed into acceptance evidence.
          python3 - <<'PY'
          import ipaddress
          import socket
          from pathlib import Path
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as probe:
              probe.connect(("192.0.2.1", 9))  # route selection; sends no UDP packet
              address = probe.getsockname()[0]
          ip = ipaddress.IPv4Address(address)
          assert not ip.is_loopback and not ip.is_unspecified
          path = Path(".env")
          overrides = {
              "MEDIA_ADVERTISED_IP": address,
              "TURN_PUBLIC_HOST": address,
              "TURN_EXTERNAL_IP": address,
          }
          lines = [line for line in path.read_text().splitlines()
                   if line.partition("=")[0] not in overrides]
          path.write_text("\n".join(lines + [f"{key}={value}" for key, value in overrides.items()]) + "\n")
          PY

      # Issue 37 asks to build api/web/media. `--build` on `up` also compiles
      # MinIO from source (Go module fetch flakes). Pull the GHCR CE pin
      # MinIO has its own release pin, independent of the app version.
      - name: Pull pinned images
        working-directory: deploy/compose
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          docker compose pull postgres redis proxy coturn
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" compose.yaml
          docker pull "$pin"

      - name: Build app images
        working-directory: deploy/compose
        run: docker compose build api web media

      - name: Start stack
        working-directory: deploy/compose
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Reach web, API, and media
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          until curl -sfS http://127.0.0.1/ready >/tmp/api-ready.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "API /ready did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done
          curl -sfS http://127.0.0.1/health >/tmp/api-health.json
          curl -sfS http://127.0.0.1/media/health >/tmp/media-health.json
          curl -sfS http://127.0.0.1/media/ready >/tmp/media-ready.json
          curl -sfS -o /tmp/index.html http://127.0.0.1/
          grep -q 'id="root"' /tmp/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          api = json.loads(Path("/tmp/api-ready.json").read_text())
          media = json.loads(Path("/tmp/media-ready.json").read_text())
          assert api.get("status") == "ready", api
          assert media.get("status") == "ready", media
          health = json.loads(Path("/tmp/api-health.json").read_text())
          assert health.get("status") == "ok", health
          mhealth = json.loads(Path("/tmp/media-health.json").read_text())
          assert mhealth.get("status") == "ok", mhealth
          PY

      - name: Node for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Chromium for browser smoke
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Two-browser voice and TURN smoke
        working-directory: web
        run: |
          command -v tc
          media_container="$(cd ../deploy/compose && docker compose ps -q media)"
          test -n "$media_container"
          export GELABBER_SMOKE_MEDIA_PID="$(docker inspect --format '{{.State.Pid}}' "$media_container")"
          npm run test:browser-smoke

      # Extended diagnosis is explicitly manual for the development release.
      # Preserve strict failures; this is not part of the baseline release gate.
      - name: Actual app media and access in Chromium and Firefox, direct and TURN
        if: github.event_name == 'workflow_dispatch' && inputs.extended_e2e
        working-directory: web
        run: |
          set -euo pipefail
          export GELABBER_E2E_WEB_SHA="$(git rev-parse HEAD)"
          export GELABBER_E2E_API_SHA="$GELABBER_E2E_WEB_SHA"
          export GELABBER_E2E_MEDIA_SHA="$GELABBER_E2E_WEB_SHA"
          export GELABBER_SMOKE_URL=http://127.0.0.1
          failed=0
          for engine in chromium firefox; do
            for network in direct relay; do
              for profile in media access; do
                if ! GELABBER_E2E_BROWSER="$engine" GELABBER_E2E_NETWORK="$network" \
                  GELABBER_E2E_PROFILE="$profile" \
                  GELABBER_E2E_REPORT="/tmp/gelabber-e2e/${engine}-${network}-${profile}.json" \
                  npm run test:e2e-app; then
                  failed=1
                fi
              done
            done
          done
          exit "$failed"

      - name: Actual app accounts, chat, DM and attachments
        working-directory: web
        run: |
          set -euo pipefail
          export GELABBER_E2E_WEB_SHA="$(git rev-parse HEAD)"
          export GELABBER_E2E_API_SHA="$GELABBER_E2E_WEB_SHA"
          export GELABBER_E2E_MEDIA_SHA="$GELABBER_E2E_WEB_SHA"
          export GELABBER_SMOKE_URL=http://127.0.0.1
          failed=0
          for engine in chromium firefox; do
            if ! GELABBER_E2E_BROWSER="$engine" GELABBER_E2E_PROFILE=core \
              GELABBER_E2E_REPORT="/tmp/gelabber-e2e/${engine}-core.json" npm run test:e2e-app; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload redacted app acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-compose
          path: /tmp/gelabber-e2e/*.json
          if-no-files-found: warn

      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: /tmp/gelabber-smoke
          if-no-files-found: ignore

      - name: Dump Compose logs
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=400

      - name: Stop stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v --remove-orphans
