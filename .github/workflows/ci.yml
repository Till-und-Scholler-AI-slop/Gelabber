# PR gate: `changes` picks the areas a pull request, merge queue entry or push
# touches and only their jobs run; ci-ok is the one required check. Manual runs run all.
name: CI

on:
  workflow_dispatch:
    inputs:
      verify_typing_stability:
        description: Require 20 consecutive isolated typing latency checks (no retries)
        type: boolean
        default: false
  pull_request:
  # The version branches' merge queue tests what will land (GEL-362); its runs
  # are treated as a pull request's: read-only, no packages, no cache saved.
  merge_group:
  push:
    branches: [main, "v[0-9]*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A re-run of an older run must not cancel the newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # read: the pull request run whose result a push to main reuses.
    permissions:
      actions: read
      contents: read
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      desktop: ${{ steps.areas.outputs.desktop }}
      deploy: ${{ steps.areas.outputs.deploy }}
      minio: ${{ steps.areas.outputs.minio }}
      minio-build: ${{ steps.areas.outputs.minio-build }}
      images: ${{ steps.areas.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A run that already passed this exact tree: on main the release PR's
      # (GEL-357), on v* the merge queue's (GEL-362). Then nothing runs again.
      - name: Run that passed this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The push's changes start at the last commit whose push run passed
          # (GEL-363): GitHub cancels a pending push run when a newer one queues.
          since="$(python3 .github/workflows/scripts/tested_tree.py since | sed -n 's/^since=//p')"
          echo "since=$since" | tee -a "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            python3 .github/workflows/scripts/tested_tree.py find >> "$GITHUB_OUTPUT"
          else
            SINCE="$since" python3 .github/workflows/scripts/tested_tree.py find-queue >> "$GITHUB_OUTPUT"
          fi

      # A release or hotfix pull request to main packages its apps as the
      # release ships them; desktop-release.yml then only signs (GEL-358).
      - name: Release candidate
        id: candidate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          candidate=false
          if [ "$BASE_REF" = main ] && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            case "$HEAD_REF" in release/v*|hotfix/v*) candidate=true ;; esac
          fi
          echo "candidate=$candidate" | tee -a "$GITHUB_OUTPUT"

      # A pull request checks out its merge commit; the first parent is the base.
      # --no-renames lists a move's source too; quotePath=false leaves non-ASCII paths unquoted.
      # A push runs the areas its commits touch, as a pull request does (GEL-360);
      # the caches of the others stay valid. Without a starting point: all.
      - name: Areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          REUSED_RUN: ${{ steps.reuse.outputs.run }}
          BEFORE: ${{ steps.reuse.outputs.since || github.event.before || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$CANDIDATE" = true ]; then
            echo "Release candidate: every area runs, so that main can reuse this run." | tee -a "$GITHUB_STEP_SUMMARY"
            python3 .github/workflows/scripts/changes.py --all >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD | python3 .github/workflows/scripts/changes.py >> "$GITHUB_OUTPUT"
          elif [ -n "$REUSED_RUN" ]; then
            echo "Run $REUSED_RUN passed this tree: no area runs again." | tee -a "$GITHUB_STEP_SUMMARY"
            python3 .github/workflows/scripts/changes.py < /dev/null >> "$GITHUB_OUTPUT"
          elif { [ "$EVENT" = push ] || [ "$EVENT" = merge_group ]; } && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch --quiet --depth=1 origin "$BEFORE" && git cat-file -e "$BEFORE^{commit}"; then
            echo "Areas changed since $BEFORE." | tee -a "$GITHUB_STEP_SUMMARY"
            git -c core.quotePath=false diff --no-renames --name-only "$BEFORE" HEAD | python3 .github/workflows/scripts/changes.py >> "$GITHUB_OUTPUT"
          else
            python3 .github/workflows/scripts/changes.py --all >> "$GITHUB_OUTPUT"
          fi

      # Deleted or loosened assertions, skips, raised limits, sleeps and
      # retries, for the reviewer (GEL-387); a report, never a gate.
      - name: Test edits to look at
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 .github/workflows/scripts/test_edits.py HEAD^1 HEAD

      - name: Record the tested tree
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          AREAS: ${{ toJSON(steps.areas.outputs) }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/workflows/scripts/tested_tree.py record

      - name: Upload the tested tree
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: tested-tree.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      # Type check only: DOCS_RS makes mediasoup-sys skip its worker build.
      - name: Clippy
        env:
          DOCS_RS: "1"
        run: cargo clippy --locked --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings

  # Two runners take half of the tests each, which halves their time.
  rust:
    name: Rust tests (${{ matrix.part }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:19.0-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      # Line tables keep backtraces; full debug info made each of the 61 test
      # binaries slower to link and the cache larger (as in desktop-native.yml).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The media image's base stage; its layers come from the media image cache
      # that main writes, so most runs skip the apt and wheel downloads.
      - name: Build verified Debian native CI toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/media/Dockerfile
          target: base
          load: true
          provenance: false
          tags: gelabber-native-ci-toolchain:local
          cache-from: type=registry,ref=ghcr.io/till-und-scholler-ai-slop/gelabber/media:buildcache

      # zizmor's cache-poisoning: the image above is only loaded for the tests, never published.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          cache-on-failure: true
          # Pushes save, pull requests only read: per-PR copies (~900 MB)
          # blew the cache quota.
          save-if: ${{ github.event_name == 'push' }}
          # Off, the key had no Cargo.lock hash: a push never saved a newer
          # cache, and the tests rebuilt every updated crate. The Rust in the
          # key is the pinned toolchain above, the image's by the shared-key.
          add-rust-environment-hash-key: true
          shared-key: native-debian-${{ hashFiles('backend/media/Dockerfile', 'backend/build/mediasoup-*', 'backend/build/install-mediasoup-debian-build-tools.sh') }}
          workspaces: backend -> target/native-debian

      # Runs the test binaries side by side instead of one after another.
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.149
          NEXTEST_SHA256: d65c7f14bcb5c1566d1ecd534c5da8dedb81ba58586e478b0ab81c877d2bd8ad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl -fsSL "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o "$archive"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Test workspace
        run: |
          set -euo pipefail
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null
          # The 100 ms typing assertion runs alone in the next step.
          sh backend/build/run-native-ci.sh nextest run --locked --workspace --all-targets --no-fail-fast \
            --partition hash:${{ matrix.part }}/2 \
            -E 'not test(typing_broadcasts_fast_and_clears_on_stop)'

      - name: Test typing latency in isolation
        if: matrix.part == 1
        env:
          VERIFY_TYPING_STABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_typing_stability }}
        run: |
          set -euo pipefail
          repetitions=1
          if [ "$VERIFY_TYPING_STABILITY" = true ]; then
            repetitions=20
          fi
          for ((iteration=1; iteration<=repetitions; iteration++)); do
            echo "Isolated typing latency check ${iteration}/${repetitions}"
            # Same flags as above, so the built tests are reused.
            sh backend/build/run-native-ci.sh test --locked --workspace --all-targets typing_broadcasts_fast_and_clears_on_stop -- --exact --test-threads=1
          done

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi

  deploy:
    name: Deploy config
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Caddy
        run: |
          set -euo pipefail
          caddy_archive="$(mktemp)"
          trap 'rm -f "$caddy_archive"' EXIT
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz" -o "$caddy_archive"
          tar -xzf "$caddy_archive" -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy
          caddy version
          test "$(caddy version | cut -d ' ' -f 1)" = "v2.11.9"

      # Security mistakes in the workflows (template injection, risky triggers,
      # credentials, permissions); exceptions with reasons in .github/zizmor.yml.
      - name: Check workflows with zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin zizmor
          zizmor --version
          zizmor --format github .github/workflows

      # Expressions, needs/outputs, runner labels and shell scripts in the
      # workflows; shellcheck at warning level, its style notes are not gated.
      - name: Check workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          tools="$(mktemp -d)"
          trap 'rm -rf "$tools"' EXIT
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$tools/actionlint.tar.gz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$tools/shellcheck.tar.xz"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum --check
          echo "${SHELLCHECK_SHA256}  $tools/shellcheck.tar.xz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$tools/actionlint" --version
          "$tools/shellcheck" --version
          "$tools/actionlint" -shellcheck "$tools/shellcheck" -pyflakes=

      # Also checks that every workflow action is pinned to a commit SHA.
      - name: Test deployment config
        run: python3 -m unittest discover -s deploy/compose/tests -v

      # The restore drill runs by hand; its own unit tests run here.
      - name: Test deployment tools
        run: python3 -m unittest discover -s deploy/tools/tests -v

  web:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      # Pull requests only read the npm cache; pushes save it (setup-node's
      # cache saved per-PR copies, which cache-cleanup.yml then deleted).
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: node-cache-Linux-x64-npm-${{ hashFiles('web/package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Save the npm cache
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Verify pinned emoji data
        run: python3 scripts/generate-emoji-data.py --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test E2E harness and scripts
        run: npm run test:checks

      # Every field state in four themes against its pictures (#561).
      - name: Field gallery
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npm run test:field-gallery

      - name: Field gallery pictures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: field-gallery
          path: web/field-gallery-out/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # The app images a pull request touches, built without pushing;
  # publish-images.yml pushes them from main.
  images:
    name: Image ${{ matrix.name }}
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names and OCI metadata
        env:
          IMAGE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=ghcr.io/${repo}/${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "GELABBER_VERSION=v$(python3 -c 'import tomllib; print(tomllib.load(open("backend/Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_ENV"
          echo "OCI_CREATED=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.name == 'media' }}
          provenance: false
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ env.GELABBER_VERSION }}
            OCI_CREATED=${{ env.OCI_CREATED }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          # Pull requests read the layer cache; main writes it.
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache

      - name: Verify actual media image readiness and normal shutdown
        if: matrix.name == 'media'
        run: python3 backend/build/check-media-image.py --image "${GHCR_IMAGE}:${IMAGE_TAG}" --revision "$GITHUB_SHA"

  # Checks the pinned MinIO and mc images, built from source when their
  # Dockerfiles change; publish-minio.yml pushes missing ones from main.
  minio:
    name: MinIO images
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.minio == 'true'
    uses: ./.github/workflows/minio-images.yml
    with:
      build: ${{ needs.changes.outputs.minio-build == 'true' }}

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # read: desktop-native.yml's prebuilt job asks for it; GitHub checks the grant even where it is skipped.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/desktop-native.yml
    with:
      candidate: ${{ needs.changes.outputs.candidate == 'true' }}

  # A libwebrtc package that a push built goes into the libwebrtc-packages
  # release, from a job that runs none of libwebrtc's build code.
  libwebrtc-store:
    name: Store libwebrtc packages
    needs: desktop
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (needs.desktop.outputs.libwebrtc-linux-store != '' || needs.desktop.outputs.libwebrtc-windows-store != '')
    permissions:
      contents: write
    uses: ./.github/workflows/libwebrtc-store.yml
    with:
      linux-key: ${{ needs.desktop.outputs.libwebrtc-linux-store }}
      windows-key: ${{ needs.desktop.outputs.libwebrtc-windows-store }}

  # The one required check: red if any job that ran failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, rust, web, deploy, images, minio, desktop, libwebrtc-store]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
