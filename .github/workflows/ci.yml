# PR gate for API, media, web and deployment config. No image push, no
# continue-on-error; missing Postgres/Redis/MinIO fail the job. Manual fault
# diagnostics live in e2e-extended.yml.
name: CI

on:
  workflow_dispatch:
    inputs:
      verify_typing_stability:
        description: Require 20 consecutive isolated typing latency checks (no retries)
        type: boolean
        default: false
  pull_request:
    paths:
      - api/**
      - media/**
      - shared/**
      - web/**
      - docker/**
      - .dockerignore
      - deploy/compose/**
      # Read by deploy/compose/tests.
      - deploy/backup.sh
      - deploy/README.md
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - desktop/Cargo.toml
      # This workflow and what its deployment tests read.
      - .github/workflows/ci.yml
      - .github/workflows/publish-images.yml
      - .github/workflows/scripts/**
  push:
    branches: [main, "v[0-9]*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      # Type check only: DOCS_RS makes mediasoup-sys skip its worker build.
      - name: Clippy
        env:
          DOCS_RS: "1"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)

      - name: Build verified Debian native CI toolchain
        run: docker build --target base --file media/Dockerfile --tag gelabber-native-ci-toolchain:local .

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Pushes save, pull requests only read: per-PR copies (~900 MB)
          # blew the cache quota.
          save-if: ${{ github.event_name == 'push' }}
          # The build runs in the Debian image (shared-key), so the runner's
          # own Rust versions must not change the key and drop the cache.
          add-rust-environment-hash-key: false
          shared-key: native-debian-${{ hashFiles('media/Dockerfile', 'docker/mediasoup-*', 'docker/install-mediasoup-debian-build-tools.sh') }}
          workspaces: . -> target/native-debian

      - name: Install Caddy
        run: |
          set -euo pipefail
          caddy_archive="$(mktemp)"
          trap 'rm -f "$caddy_archive"' EXIT
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz" -o "$caddy_archive"
          tar -xzf "$caddy_archive" -C /usr/local/bin caddy
          chmod +x /usr/local/bin/caddy
          caddy version
          test "$(caddy version | cut -d ' ' -f 1)" = "v2.11.4"

      - name: Test deployment config
        run: python3 -m unittest discover -s deploy/compose/tests -v

      - name: Test workspace
        run: |
          set -euo pipefail
          test -n "$MINIO_ENDPOINT"
          test -n "$MINIO_ROOT_USER"
          test -n "$MINIO_ROOT_PASSWORD"
          curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null
          # The 100 ms typing assertion runs alone in the next step.
          sh docker/run-native-ci.sh test --locked --workspace --all-targets --no-fail-fast -- --skip typing_broadcasts_fast_and_clears_on_stop --test-threads=4

      - name: Test typing latency in isolation
        env:
          VERIFY_TYPING_STABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_typing_stability }}
        run: |
          set -euo pipefail
          repetitions=1
          if [ "$VERIFY_TYPING_STABILITY" = true ]; then
            repetitions=20
          fi
          for ((iteration=1; iteration<=repetitions; iteration++)); do
            echo "Isolated typing latency check ${iteration}/${repetitions}"
            # Same flags as above, so the built tests are reused.
            sh docker/run-native-ci.sh test --locked --workspace --all-targets typing_broadcasts_fast_and_clears_on_stop -- --exact --test-threads=1
          done

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify pinned emoji data
        run: python3 ../tools/generate-emoji-data.py --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test E2E harness and scripts
        run: npm run test:checks

      - name: Build
        run: npm run build
