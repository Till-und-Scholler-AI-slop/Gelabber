# A maintainer explicitly releases a completed, CI-gated main image set.
# No release on every main push, feature branch, or arbitrary v* tag push.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Completed release version (must match image set and workspace)
        required: true
      image_run_id:
        description: Successful Publish app images run containing the promoted image-set artifact
        required: true
      refresh_latest_only:
        description: Only repair latest aliases for the current published stable release
        type: boolean
        default: false

concurrency:
  group: app-images-main
  cancel-in-progress: false

permissions:
  # write: dispatches the desktop workflow for the new release.
  actions: write
  contents: write
  packages: write

jobs:
  github-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The desktop apps carry the version of their own workspace, and
      # desktop-native.yml attaches them only to a release whose tag is that
      # version. Found out here, before the tag and the release exist.
      - name: Desktop apps have the release's version
        if: ${{ !inputs.refresh_latest_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          app="v$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n1)"
          if [ "$app" != "$RELEASE_TAG" ]; then
            echo "::error::desktop/Cargo.toml says $app, the release is $RELEASE_TAG: the version there (and in desktop/Cargo.lock) comes first"
            exit 1
          fi
      # The Windows app updates itself from the release (desktop/app/src/
      # update.rs): desktop-native.yml signs the installer and fails without
      # the key. Found out here, before the tag and the release exist.
      - name: Desktop updater key
        if: ${{ !inputs.refresh_latest_only }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ ! -s desktop/app/updater.pub ]; then
            echo "::error::desktop/app/updater.pub is missing: the public key the app checks updates with (desktop/README.md, Updates)"
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::the secret TAURI_SIGNING_PRIVATE_KEY is not set: the Windows installer cannot be signed for the updater (desktop/README.md, Updates)"
            exit 1
          fi
      - name: Download exact image set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-set
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check artifact provenance
        env:
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
        run: |
          python3 -c 'import json,os; assert json.load(open("image-set.json"))["publish_run_id"] == int(os.environ["IMAGE_RUN_ID"])'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image set, release and update latest aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REFRESH_LATEST_ONLY: ${{ inputs.refresh_latest_only }}
        run: |
          if [ "$REFRESH_LATEST_ONLY" = true ]; then
            python3 .github/workflows/scripts/image_set.py latest
          else
            python3 .github/workflows/scripts/image_set.py release
          fi
      # A release created with the workflow token raises no release event, so
      # the desktop app (Linux tarball, pacman repository) is dispatched here.
      - name: Desktop app for the release
        if: ${{ !inputs.refresh_latest_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh workflow run desktop-native.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
