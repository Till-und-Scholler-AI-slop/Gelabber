# A maintainer explicitly releases a completed, CI-gated main image set.
# No release on every main push, feature branch, or arbitrary v* tag push.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Completed release version (must match image set and workspace)
        required: true
      image_run_id:
        description: Successful Publish app images run containing the promoted image-set artifact
        required: true

concurrency:
  group: app-images-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  github-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download exact image set
        uses: actions/download-artifact@v4
        with:
          name: image-set
          run-id: ${{ inputs.image_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check artifact provenance
        env:
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
        run: |
          python3 -c 'import json,os; assert json.load(open("image-set.json"))["publish_run_id"] == int(os.environ["IMAGE_RUN_ID"])'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact CI and immutable image set, then create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/workflows/scripts/image_set.py release
