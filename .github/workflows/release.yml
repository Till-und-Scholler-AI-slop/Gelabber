# Tagged releases. Org GHCR packages start private; GitHub has no REST/GraphQL
# endpoint to flip visibility (PATCH returns 404 even with packages:write).
# public-minio records that and links the one-time UI step.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created on this commit if missing)"
        required: true
        default: "v0.2.1"

permissions:
  contents: write
  packages: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            echo "No version tag on this run (got '${tag:-empty}'). Skipping."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          python3 <<'PY' > /tmp/notes.md
          print("""v0.2.1: Dark Mode und Voice-/Geräte-/Toast-Stabilität. `docker compose up` zieht api/web/media/minio als `v0.2.1`. #89 Dark Mode (schließt #83). #82 Voice-, Geräte- und Toast-Stabilität (schließt #78, #81). Eigenes WebSocket / Signaling / SFU — kein LiveKit. Ein Source-Build setzt das Debian-CA-Bundle für cargo; bei Docker-Desktop-TLS-Inspection (OpenSSL 19) wird die präsentierte Kette mitvertraut, damit crates.io erreichbar bleibt.

          Lokal: `cp deploy/compose/.env.example deploy/compose/.env && cd deploy/compose && docker compose up`

          Images: `ghcr.io/till-und-scholler-ai-slop/gelabber/{api,web,media,minio}:v0.2.1` (plus `latest`; MinIO zusätzlich der Pin).

          ### Enthalten
          - Auth (Cookie-Session, CSRF, Profil)
          - Server, Einladungen, Rollen, Kanäle
          - Textnachrichten (REST + optimistic UI)
          - Eigenes WS-Gateway, Presence, Typing
          - Direktnachrichten 1:1
          - Anhänge über MinIO
          - WebRTC-Signaling, eigener SFU + coturn
          - Sprachkanal, Kamera, Screen-Share, Go Live
          - Voice/Video-Settings: Lautstärke, Bitrate-Profil, Screen-Fokus, Geräte/AEC
          - In-App Toasts für neue Nachrichten
          - Dark Mode: Hell, Dunkel, System
          - Moderation, Limits, Observability
          - Compose-Kern (Caddy, Postgres, Redis, MinIO, coturn)

          ### v0.2.1
          - #89 Dark Mode Hell/Dunkel/System (schließt #83)
          - #82 Voice-, Geräte- und Toast-Stabilität (schließt #78, #81)

          ### v0.2.0
          - #75 Voice/Video-Settings + Toasts (schließt #58, #59, #60, #61, #62, #68)
          - #70 Bild-Uploads / MinIO-vHost (schließt #69; bereits auf main)
          """)
          PY
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "Gelabber ${tag}" \
            --notes-file /tmp/notes.md \
            --generate-notes

  public-minio:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check gelabber/minio visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          encoded='gelabber%2Fminio'
          path="orgs/${{ github.repository_owner }}/packages/container/${encoded}"
          vis="$(gh api "$path" --jq .visibility || true)"
          if [ "$vis" = "public" ]; then
            echo "GHCR package gelabber/minio is public."
            exit 0
          fi
          echo "Current visibility: ${vis:-unknown}. Trying PATCH (org packages usually 404)…"
          gh api --method PATCH "$path" -f visibility=public || true
          vis="$(gh api "$path" --jq .visibility || true)"
          if [ "$vis" = "public" ]; then
            echo "GHCR package gelabber/minio is public."
            exit 0
          fi
          echo "::warning::GHCR package gelabber/minio is still ${vis:-unknown/private}. GitHub has no API to make org container packages public. Maintainer UI: https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/gelabber%2Fminio → Package settings → Change visibility → Public."
          exit 1
