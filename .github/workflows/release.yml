# Releases a new version as soon as its images are published from main
# (image_set.py decide). By hand only to repeat a release or repair latest.
name: Release

on:
  workflow_run:
    workflows: [Publish app images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Completed release version (must match image set and workspace)
        required: true
      image_run_id:
        description: Successful Publish app images run containing the promoted image-set artifact
        required: true
      refresh_latest_only:
        description: Only repair latest aliases for the current published stable release
        type: boolean
        default: false

concurrency:
  group: app-images-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The version and image set to release, or none: a main commit that keeps
  # the shipped version publishes images but releases nothing.
  decide:
    name: Version to release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      image_run_id: ${{ steps.decide.outputs.image_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the run's image set
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-set
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN: ${{ inputs.image_run_id }}
          IMAGE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            printf 'tag=%s\nimage_run_id=%s\n' "$INPUT_TAG" "$INPUT_RUN" >> "$GITHUB_OUTPUT"
          else
            python3 .github/workflows/scripts/image_set.py decide >> "$GITHUB_OUTPUT"
          fi

  github-release:
    name: GitHub release
    needs: decide
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # write: dispatches the desktop workflow for the new release.
      actions: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # The desktop app carries the version of its own workspace, and
      # desktop-release.yml attaches it only to a release whose tag is that
      # version. Found out here, before the tag and the release exist.
      - name: Desktop app has the release's version
        if: ${{ !inputs.refresh_latest_only }}
        env:
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          app="v$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n1)"
          if [ "$app" != "$RELEASE_TAG" ]; then
            echo "::error::desktop/Cargo.toml says $app, the release is $RELEASE_TAG: the version there (and in desktop/Cargo.lock) comes first"
            exit 1
          fi
      # desktop-native.yml signs the installer the Windows app updates from and
      # fails without the key: found out here, before the tag and release exist.
      - name: Desktop updater key
        if: ${{ !inputs.refresh_latest_only }}
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ ! -s desktop/packaging/updater.pub ]; then
            echo "::error::desktop/packaging/updater.pub is missing: the public key the app checks updates with (desktop/README.md, Updates)"
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::the secret TAURI_SIGNING_PRIVATE_KEY is not set: the Windows installer cannot be signed for the updater (desktop/README.md, Updates)"
            exit 1
          fi
      - name: Download exact image set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-set
          run-id: ${{ needs.decide.outputs.image_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check artifact provenance
        env:
          IMAGE_RUN_ID: ${{ needs.decide.outputs.image_run_id }}
        run: |
          python3 -c 'import json,os; assert json.load(open("image-set.json"))["publish_run_id"] == int(os.environ["IMAGE_RUN_ID"])'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image set, release and update latest aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
          REFRESH_LATEST_ONLY: ${{ inputs.refresh_latest_only }}
        run: |
          if [ "$REFRESH_LATEST_ONLY" = true ]; then
            python3 .github/workflows/scripts/image_set.py latest
          else
            python3 .github/workflows/scripts/image_set.py release
          fi
      # A release created with the workflow token raises no release event, so
      # the desktop app (installer, tarball, pacman repository) is dispatched here.
      - name: Desktop app for the release
        if: ${{ !inputs.refresh_latest_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: gh workflow run desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
