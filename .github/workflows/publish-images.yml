# Main publishing starts only after CI of the exact main SHA succeeds.
name: Publish app images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - api/**
      - media/**
      - shared/**
      - web/**
      - docker/**
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - deploy/compose/**
      - .github/workflows/**

# Serialize promotion across main revisions, including reruns.
concurrency:
  group: app-images-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: api/Dockerfile
          - name: media
            context: .
            file: media/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Image names and OCI metadata
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=ghcr.io/${repo}/${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "GELABBER_VERSION=v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_ENV"
          echo "OCI_CREATED=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Compose version pins match workspace
        run: |
          grep -F "${GHCR_IMAGE}:${GELABBER_VERSION}" deploy/compose/compose.yaml
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build SHA image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'workflow_run' }}
          load: ${{ github.event_name == 'pull_request' && matrix.name == 'media' }}
          provenance: false
          tags: ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            OCI_REVISION=${{ env.SOURCE_SHA }}
            OCI_VERSION=${{ env.GELABBER_VERSION }}
            OCI_CREATED=${{ env.OCI_CREATED }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify actual media image readiness and normal shutdown
        if: github.event_name == 'pull_request' && matrix.name == 'media'
        run: python3 docker/check-media-image.py --image "${GHCR_IMAGE}:${IMAGE_TAG}" --revision "$SOURCE_SHA"
      - name: Record digest
        if: github.event_name == 'workflow_run'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          python3 -c 'import json,os; json.dump({"image":os.environ["GHCR_IMAGE"],"digest":os.environ["DIGEST"],"tag":os.environ["IMAGE_TAG"],"revision":os.environ["SOURCE_SHA"]},open("digests/${{ matrix.name }}.json","w"))'
      - name: Upload digest
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*.json

  promote:
    needs: publish
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Verify CI, preflight immutable release, record image set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/workflows/scripts/image_set.py promote
      - name: Upload image set (also on unchanged-version skip)
        uses: actions/upload-artifact@v4
        with:
          name: image-set
          path: image-set.*
          if-no-files-found: error
          retention-days: 90
