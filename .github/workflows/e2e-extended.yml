# Fault diagnostics on demand: the real app against Postgres, Redis and MinIO
# in Chromium and Firefox, with API/Redis and SFU faults. Not a PR gate. Runs
# when a pull request gets the label e2e-extended (also before this file is
# on main, which workflow_dispatch needs) or by hand.
name: Extended E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-extended-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  faults:
    name: Fault acceptance (Chromium, Firefox)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e-extended'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: gelabber
          POSTGRES_PASSWORD: gelabber
          POSTGRES_DB: gelabber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gelabber -d gelabber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gelabber:gelabber@127.0.0.1:5432/gelabber
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: gelabber-ci
      MINIO_ROOT_PASSWORD: gelabber-ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR for pinned test MinIO
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start real pinned MinIO for storage regressions
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pin="ghcr.io/${repo}/minio:${MINIO_RELEASE}"
          grep -F "MINIO_RELEASE: ${MINIO_RELEASE}" deploy/compose/compose.yaml
          grep -F "ghcr.io/${repo}/minio:${MINIO_RELEASE}" deploy/compose/compose.yaml
          docker pull "$pin"
          docker run -d --name gelabber-rust-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_API_CORS_ALLOW_ORIGIN='*' "$pin" server /data
          deadline=$((SECONDS + 120))
          until curl -fsS "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Required MinIO did not become ready within 120s"
              exit 1
            fi
            sleep 2
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)
        with:
          components: rustfmt

      - name: Native build tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-venv
          python3 - <<'PY'
          import json, subprocess
          commands = {"gcc": ["gcc", "--version"], "g++": ["g++", "--version"],
                      "python": ["python3", "--version"]}
          print(json.dumps({"scope": "Ubuntu fault diagnostics; separate from the Debian PR gate",
                            "versions": {name: subprocess.check_output(command, text=True).splitlines()[0]
                                         for name, command in commands.items()},
                            "packages": subprocess.check_output(["dpkg-query", "-W", "build-essential",
                                                                  "gcc", "g++", "python3", "python3-venv"],
                                                                 text=True).splitlines()}, indent=2))
          PY
          native_build_dir="${RUNNER_TEMP}/gelabber-native-build"
          python3 docker/mediasoup-build-tools.py --destination "$native_build_dir"
          python3 - "$native_build_dir" "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]).resolve()
          values = {"PYTHON": root / "native-python", "CARGO_BUILD_JOBS": "2", "PIP_NO_INDEX": "1",
                    "PIP_FIND_LINKS": root / "wheelhouse", "PIP_CONSTRAINT": root / "constraints.txt",
                    "MESON_VERSION": "1.12.0", "NINJA_VERSION": "1.13.2"}
          with open(sys.argv[2], "a") as output:
              output.writelines(f"{name}={value}\n" for name, value in values.items())
          PY

      - name: Build owned API and SFU for isolated fault acceptance
        run: cargo build --locked -p gelabber-api -p gelabber-media

      - name: Node for owned core fault acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install real browsers and SQL fixture client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm ci --prefix web
          cd web
          npx playwright install --with-deps chromium firefox

      - name: Prepare dedicated fault database, bucket and immutable API/SFU copies
        env:
          GELABBER_E2E_PREPARE_MEDIA: "true"
        run: node web/scripts/e2e/ci-fault-prepare.mjs

      - name: Real app core and API/Redis Live-lease faults in both browsers
        run: |
          set -euo pipefail
          failed=0
          for engine in chromium firefox; do
            for profile in core-faults media-faults; do
              owned_media_env="$GELABBER_E2E_MEDIA_FAULT_ENV"
              owned_media_manifest="$GELABBER_E2E_MEDIA_MANIFEST"
              if [ "$profile" = core-faults ]; then
                owned_media_env=
                owned_media_manifest=
              fi
              if ! GELABBER_E2E_MEDIA_FAULT_ENV="$owned_media_env" \
                GELABBER_E2E_MEDIA_MANIFEST="$owned_media_manifest" \
                GELABBER_E2E_BROWSER="$engine" GELABBER_E2E_PROFILE="$profile" \
                GELABBER_E2E_REPORT="/tmp/gelabber-e2e/${engine}-${profile}.json" \
                node web/scripts/e2e/fault-run.mjs; then
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Upload redacted owned fault results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-acceptance-core-faults
          path: /tmp/gelabber-e2e/*.json
          if-no-files-found: warn

      - name: Dump test MinIO logs
        if: failure()
        run: docker logs gelabber-rust-minio

      - name: Stop owned test MinIO
        if: always()
        run: |
          if docker container inspect gelabber-rust-minio >/dev/null 2>&1; then
            docker rm -f gelabber-rust-minio
          fi
