# Moves issue cards on the organization project (Status) from issue and PR
# events; rules in .github/workflows/scripts/project_status.py.
name: Project status

on:
  issues:
    types: [assigned, unassigned]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, edited, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      status:
        description: New Status
        required: true
        type: choice
        options: [Backlog, Planned, In progress, In review, Done]

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status:
    name: Move project cards
    # Fork PRs get no secrets; their cards are moved by hand.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Closes issues whose PR merged into a version branch.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Move cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with organization Projects read/write (GITHUB_TOKEN cannot reach projects).
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: '2'
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_STATUS: ${{ inputs.status }}
        run: python3 .github/workflows/scripts/project_status.py
