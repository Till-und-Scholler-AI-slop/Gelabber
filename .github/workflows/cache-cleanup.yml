# Deletes superseded Actions caches (scripts/caches.py): the quota is 10 GB,
# and old generations would otherwise evict the newest caches.
name: Cache cleanup

on:
  # Pushes save caches; the cleanup follows them.
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete superseded caches
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            python3 .github/workflows/scripts/caches.py --dry-run
          else
            python3 .github/workflows/scripts/caches.py
          fi
