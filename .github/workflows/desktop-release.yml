# Builds the desktop app for a published release and attaches it;
# once enabled, also publishes the pacman repository (desktop/packaging/arch).
# release.yml dispatches this with release_tag: a release made with the
# workflow token raises no release event.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to attach the apps to and build the pacman repository for (run on that tag)
        required: true
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    # Other releases (the build-deps mirror) are no app version.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    # For its libwebrtc jobs, which store a new package in a release.
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-native.yml
    with:
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag }}
    secrets: inherit

  # The app tarball becomes a release asset, which the PKGBUILD downloads.
  # `build` includes the third-party notices, so none go out of date.
  release-asset:
    name: Attach the Linux app to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the native app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-linux-x64
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release upload "$TAG" gelabber-native-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  # The installer, its checksum and signature, and the manifests the
  # installed apps poll: latest-native.json (0.9 on), latest.json (Tauri 0.8).
  release-asset-windows:
    name: Attach the Windows app to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the native app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-windows-x64
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # The installer must be built from the released source, as the
          # Linux package is.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "release $TAG must be built from its tag, not $GITHUB_REF"; exit 1
          fi
          sha256sum --check gelabber-native-windows-x64-setup.exe.sha256
          setup=gelabber-native-windows-x64-setup.exe
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$setup"
          jq -n --arg version "${TAG#v}" --arg url "$url" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "$setup.sig" \
            '{version: $version, pub_date: $date,
              platforms: {"windows-x86_64": {url: $url, signature: ($signature | rtrimstr("\n"))}}}' > latest-native.json
          cat latest-native.json
          # The Tauri apps' updater reads latest.json: the same, so they install the native app.
          cp latest-native.json latest.json
          gh release upload "$TAG" "$setup" "$setup.sha256" "$setup.sig" latest-native.json latest.json \
            --clobber --repo "$GITHUB_REPOSITORY"

  # Public: the repository on GitHub Pages. Off until the repository
  # variable ARCH_REPO_PUBLISH is "true", and the github-pages environment
  # should require an approval (desktop/packaging/arch/README.md).
  arch-repo-publish:
    name: Publish the pacman repository
    if: vars.ARCH_REPO_PUBLISH == 'true'
    needs: [build, release-asset]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-repo
          path: site
      # One name per attempt: a second artifact of one name stops deploy-pages,
      # so a re-run after a failed deployment could never pass.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
