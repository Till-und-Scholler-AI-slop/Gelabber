# Desktop app for Linux and Windows: libwebrtc builds (cached), the native
# core with a loopback call against mediasoup and the packaged app. ci.yml
# calls it for pull requests and pushes, desktop-release.yml for a release.
name: Desktop native core

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release to build for (signing keys, pacman repository); empty for checks
        type: string
        required: false
        default: ""
      # Packaging runs after merge (main/v*), for releases and their candidates.
      package:
        description: Build and test the packages (tarball, installer, pacman repository)
        type: boolean
        required: false
        default: false
      # Release and hotfix pull requests to main (GEL-358): the release's
      # packages, signed only once the tag exists.
      candidate:
        description: Package the apps as the release will ship them, without signing
        type: boolean
        required: false
        default: false
      prebuilt_run:
        description: CI run of the release's pull request whose candidate packages to sign instead of building
        type: string
        required: false
        default: ""
    # Release runs only (desktop-release.yml passes them by name).
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ARCH_REPO_GPG_KEY:
        required: false
    # A libwebrtc package to store in the libwebrtc-packages release (pushes,
    # releases): its cache key, or empty. libwebrtc-store.yml stores it.
    outputs:
      libwebrtc-linux-store:
        value: ${{ jobs.libwebrtc-linux.outputs.store }}
      libwebrtc-windows-store:
        value: ${{ jobs.libwebrtc-windows.outputs.store }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep backtraces; full debug info made the target directory
  # and its cache about a third larger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RELEASE_TAG: ${{ inputs.release_tag }}
  CANDIDATE: ${{ inputs.candidate }}

jobs:
  libwebrtc-linux:
    name: libwebrtc (Linux x64)
    if: inputs.prebuilt_run == ''
    runs-on: ubuntu-24.04
    # GitHub's limit: the build plus the renewal of the notices after it.
    timeout-minutes: 360
    # Read-only like every job here: the build runs gclient hooks and other
    # fetched code, so libwebrtc-store.yml stores a new package in a job of its own.
    outputs:
      key: ${{ steps.key.outputs.key }}
      store: ${{ steps.asset.outputs.missing == 'true' && steps.key.outputs.key || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        run: |
          echo "key=libwebrtc-linux-x64-${{ hashFiles('desktop/native/libwebrtc.env', 'desktop/native/scripts/build-libwebrtc-linux.sh', 'desktop/native/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Restore libwebrtc package
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # The cache is evicted under the quota; the libwebrtc-packages release
      # keeps every package, so a miss costs a download, not a build. Anyone
      # with write access can replace an asset, so only one whose SHA-256 the
      # repository lists is taken.
      - name: Fetch the stored package
        id: stored
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/libwebrtc-package /mnt/libwebrtc-fetch
          sudo chown -R "$USER" /mnt/libwebrtc-package /mnt/libwebrtc-fetch
          pin=$(grep -F "  $KEY.tar.zst" desktop/native/libwebrtc-packages.sha256 || true)
          if [ -z "$pin" ]; then
            echo "desktop/native/libwebrtc-packages.sha256 lists no $KEY.tar.zst, so the package is built."
            echo "found=false" >> "$GITHUB_OUTPUT"
          elif gh release download libwebrtc-packages --repo "$GITHUB_REPOSITORY" \
            --pattern "$KEY.tar.zst" --dir /mnt/libwebrtc-fetch; then
            (cd /mnt/libwebrtc-fetch && printf '%s\n' "$pin" | sha256sum --check --strict)
            tar --zstd -xf "/mnt/libwebrtc-fetch/$KEY.tar.zst" -C /mnt/libwebrtc-package
            test -f /mnt/libwebrtc-package/lib/libwebrtc.a
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          # /mnt is root's, so the directory itself goes with sudo.
          sudo rm -rf /mnt/libwebrtc-fetch

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          sudo mkdir -p /mnt/webrtc /mnt/libwebrtc-package
          sudo chown -R "$USER" /mnt/webrtc /mnt/libwebrtc-package
          df -h / /mnt

      - name: Build libwebrtc
        id: build
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          desktop/native/scripts/build-libwebrtc-linux.sh /mnt/webrtc /mnt/libwebrtc-package
          minutes=$(( (SECONDS - start) / 60 ))
          {
            echo "### libwebrtc (Linux x64)"
            echo
            echo "Build time: ${minutes} min"
            echo
            echo '```'
            cat /mnt/libwebrtc-package/VERSIONS
            du -sh /mnt/libwebrtc-package/lib/libwebrtc.a /mnt/libwebrtc-package/include /mnt/libwebrtc-package/toolchain /mnt/libwebrtc-package/sysroot
            du -sh /mnt/webrtc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / /mnt

      - name: Save libwebrtc package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ steps.key.outputs.key }}

      - name: Is the package stored?
        id: asset
        if: inputs.package && !inputs.candidate && steps.stored.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: desktop/native/scripts/libwebrtc-stored.sh "$KEY.tar.zst" >> "$GITHUB_OUTPUT"

      # A new libwebrtc build renews part 2 of the third-party notices: the step
      # summary says whether it changed, the artifact holds the file to commit.
      - name: Rust toolchain (notices)
        if: steps.build.outcome == 'success'
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)

      - name: Renew the third-party notices
        id: notices
        if: steps.build.outcome == 'success'
        env:
          GELABBER_LIBWEBRTC_DIR: /mnt/libwebrtc-package
        run: |
          set -euo pipefail
          .github/workflows/scripts/apt-install.sh ninja-build python3-venv
          cargo build --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core
          build=$(ls -d desktop/target/debug/build/gelabber-media-core-*/out/build | head -n 1)
          python3 desktop/packaging/third-party-notices.py --webrtc-src /mnt/webrtc/src --core-build "$build"
          notices=desktop/packaging/native/THIRD-PARTY-NOTICES.txt
          if git diff --quiet -- "$notices"; then
            echo "Third-party notices ($notices): unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Third-party notices ($notices): renewed, $(git diff --numstat -- "$notices" | awk '{print "+" $1 " -" $2}') lines; commit the artifact third-party-notices." >> "$GITHUB_STEP_SUMMARY"
            echo "::group::diff of $notices (gzip, base64)"
            git diff -- "$notices" | gzip -9 | base64 -w 0
            echo
            echo "::endgroup::"
          fi

      - name: Upload the renewed notices
        if: steps.notices.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: desktop/packaging/native/THIRD-PARTY-NOTICES.txt

  libwebrtc-windows:
    name: libwebrtc (Windows x64)
    if: inputs.prebuilt_run == ''
    runs-on: windows-2022
    timeout-minutes: 330
    # Read-only like every job here: the build runs gclient hooks and other
    # fetched code, so libwebrtc-store.yml stores a new package in a job of its own.
    outputs:
      key: ${{ steps.key.outputs.key }}
      store: ${{ steps.asset.outputs.missing == 'true' && steps.key.outputs.key || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "key=libwebrtc-windows-x64-${{ hashFiles('desktop/native/libwebrtc.env', 'desktop/native/scripts/build-libwebrtc-windows.ps1', 'desktop/native/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Restore libwebrtc package
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # As on Linux: the release keeps what the cache loses. Windows' own tar
      # takes C:\ paths, which Git's does not.
      - name: Fetch the stored package
        id: stored
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          $name = "$($env:KEY).tar.gz"
          $fetch = Join-Path $env:RUNNER_TEMP libwebrtc-fetch
          New-Item -ItemType Directory -Force C:\libwebrtc-package, $fetch | Out-Null
          # Only a package whose SHA-256 the repository lists is taken (see Linux).
          $pin = Select-String -Path desktop\native\libwebrtc-packages.sha256 -SimpleMatch "  $name" | Select-Object -First 1
          if ($pin) {
            gh release download libwebrtc-packages --repo $env:GITHUB_REPOSITORY --pattern $name --dir $fetch
          } else {
            "desktop/native/libwebrtc-packages.sha256 lists no $name, so the package is built."
            $global:LASTEXITCODE = 1
          }
          if ($LASTEXITCODE -eq 0) {
            $want = ($pin.Line -split '\s+')[0]
            $have = (Get-FileHash -Algorithm SHA256 (Join-Path $fetch $name)).Hash.ToLower()
            if ($have -ne $want) { throw "the stored package's SHA-256 is $have, not the listed $want" }
            & "$env:SystemRoot\System32\tar.exe" -xzf (Join-Path $fetch $name) -C C:\libwebrtc-package
            if ($LASTEXITCODE -ne 0) { throw "the stored package does not unpack" }
            if (-not (Test-Path C:\libwebrtc-package\lib\webrtc.lib)) { throw "the stored package has no webrtc.lib" }
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
          }
          Remove-Item -Recurse -Force $fetch
          $global:LASTEXITCODE = 0

      - name: Python
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build libwebrtc
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $start = Get-Date
          ./desktop/native/scripts/build-libwebrtc-windows.ps1 -Work C:\webrtc -Package C:\libwebrtc-package
          $minutes = [int]((Get-Date) - $start).TotalMinutes
          $lib = Get-Item C:\libwebrtc-package\lib\webrtc.lib
          @(
            "### libwebrtc (Windows x64)", "",
            "Build time: $minutes min", "",
            "webrtc.lib: $([math]::Round($lib.Length / 1MB)) MiB"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Save libwebrtc package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ steps.key.outputs.key }}

      - name: Is the package stored?
        id: asset
        if: inputs.package && !inputs.candidate && steps.stored.outputs.found != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: desktop/native/scripts/libwebrtc-stored.sh "$KEY.tar.gz" >> "$GITHUB_OUTPUT"

  core-linux:
    name: Native core (Linux x64)
    needs: libwebrtc-linux
    if: inputs.prebuilt_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GELABBER_LIBWEBRTC_DIR: /mnt/libwebrtc-package
      # Build scripts get debug info too; otherwise `cargo test --test <name>`
      # rebuilds quote/syn and a second mediasoup worker (~6 min).
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare package directory
        run: sudo mkdir -p /mnt/libwebrtc-package && sudo chown -R "$USER" /mnt/libwebrtc-package

      - name: Restore libwebrtc package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ needs.libwebrtc-linux.outputs.key }}
          fail-on-cache-miss: true

      # Xvfb and lavapipe for the app's smoke test, gdb for the voice test's
      # backtrace. apt-install.sh leaves a slow Ubuntu mirror for another one.
      - name: Build tools
        timeout-minutes: 15
        run: |
          .github/workflows/scripts/apt-install.sh ninja-build python3-venv \
            xvfb xauth mesa-vulkan-drivers gdb

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)
        with:
          components: rustfmt, clippy

      # The mediasoup worker (dev-dependency) takes minutes to build.
      # Written by pushes to main and the release branches, read by pull
      # requests: a copy per pull request (some 2.7 GB) pushed the
      # repository past its cache quota and evicted the others.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          save-if: ${{ github.event_name == 'push' }}

      # A release is built from a commit CI has tested on main, so its build
      # runs the code checks no more: a flaky one would hold the release back.
      # One loopback call stays, the only check that runs the release's core.
      - name: Format
        if: inputs.release_tag == ''
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Clippy
        if: inputs.release_tag == ''
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      # GStreamer and the test desktop (PipeWire, pipewire-pulse,
      # xdg-desktop-portal). x264enc and avdec_h264 (av1enc and av1dec for
      # AV1) stand in for VA-API/NVENC/NVDEC, which runners lack, to test the
      # GStreamer encoder and decoder paths themselves.
      - name: Test packages
        timeout-minutes: 15
        run: |
          .github/workflows/scripts/apt-install.sh pipewire wireplumber pipewire-pulse \
            pulseaudio-utils xdg-desktop-portal \
            libpipewire-0.3-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav python3-gi

      - name: Install cargo-nextest
        if: inputs.release_tag == ''
        run: .github/workflows/scripts/install-nextest.sh

      # Every test of the workspace. This core is built with H264, so the
      # loopback call must use it. Profile ci retries a failed test once and
      # writes JUnit (desktop/.config/nextest.toml); nextest skips doctests.
      # The media tests run one at a time, the others side by side (GEL-393).
      - name: Loopback call against mediasoup 0.33
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          MEDIA_TESTS: package(gelabber-media-core) | package(gelabber-call)
        run: |
          set -uo pipefail
          status=0
          cargo nextest run --profile ci-media --locked --manifest-path desktop/Cargo.toml --no-fail-fast -E "$MEDIA_TESTS" || status=1
          cargo nextest run --profile ci --locked --manifest-path desktop/Cargo.toml --no-fail-fast -E "not ($MEDIA_TESTS)" || status=1
          cargo test --locked --manifest-path desktop/Cargo.toml --doc || status=1
          exit "$status"

      # A test that passed only on retry passes the run, but never silently.
      - name: Flaky tests
        if: ${{ !cancelled() && inputs.release_tag == '' }}
        env:
          JOB_LABEL: Native core (Linux x64)
        run: python3 .github/workflows/scripts/flaky_tests.py summary desktop/target/nextest/ci-media/junit.xml desktop/target/nextest/ci/junit.xml

      - name: Upload the test report
        if: ${{ !cancelled() && inputs.release_tag == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-desktop-linux
          path: |
            desktop/target/nextest/ci-media/junit.xml
            desktop/target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Loopback call with the GStreamer H264 encoder
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_H264_ENCODER: x264enc
          GELABBER_EXPECT_ENCODER: GStreamer x264enc
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --locked --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      - name: Loopback call with the GStreamer H264 decoder
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_H264_DECODER: avdec_h264
          GELABBER_EXPECT_DECODER: GStreamer avdec_h264
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --locked --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # AV1 through GStreamer in front of libaom and dav1d: av1enc and av1dec
      # (libaom in gst-plugins-bad) stand in for NVENC/VA-API/NVDEC.
      - name: Loopback call with GStreamer AV1 codecs
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_AV1_ENCODER: av1enc
          GELABBER_EXPECT_AV1_ENCODER: GStreamer av1enc
          GELABBER_AV1_DECODER: av1dec
          GELABBER_EXPECT_AV1_DECODER: GStreamer av1dec
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --locked --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # System AV1 codecs that fail: identity as the encoder hands raw
      # pictures to av1parse, which refuses them once the call runs; as the
      # decoder it cannot link AV1 to videoconvert, so it does not start.
      # libaom and dav1d take over.
      - name: Loopback call with failing GStreamer AV1 codecs
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_AV1_ENCODER: identity
          GELABBER_EXPECT_AV1_ENCODER: libaom
          GELABBER_AV1_DECODER: identity
          GELABBER_EXPECT_AV1_DECODER: dav1d
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --locked --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # Real xdg-desktop-portal frontend and PipeWire, with a test backend
      # whose monitor is a shared-memory test stream (no compositor or GPU here).
      - name: Screen capture through the ScreenCast portal
        if: inputs.release_tag == ''
        timeout-minutes: 15
        env:
          GELABBER_TEST_SCREEN: "1"
          GELABBER_MEDIA_LOG: "1"
          GELABBER_H264_ENCODER: x264enc
          GELABBER_EXPECT_ENCODER: GStreamer x264enc
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --locked --manifest-path desktop/Cargo.toml --test screen_capture -- --nocapture

      # libwebrtc's PulseAudio device module on pipewire-pulse: white noise
      # from a null sink's monitor as the microphone, another null sink as
      # the speakers. Covers device selection, the three processing modes
      # (RNNoise included), Opus through mediasoup and playout.
      - name: Voice through PulseAudio devices
        if: inputs.release_tag == ''
        id: voice
        timeout-minutes: 10
        env:
          GELABBER_TEST_AUDIO: "1"
          GELABBER_MEDIA_LOG: "1"
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --locked --manifest-path desktop/Cargo.toml --test voice -- --nocapture

      # A native abort kills the test without a Rust backtrace.
      - name: Voice test backtrace
        if: failure() && steps.voice.outcome == 'failure'
        timeout-minutes: 10
        env:
          GELABBER_TEST_AUDIO: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/desktop/native/scripts/gdb-backtrace.sh
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --locked --manifest-path desktop/Cargo.toml --test voice -- --nocapture || true

      # The native app (desktop/gelabber) on lavapipe under Xvfb, no server and
      # empty settings: it must paint its setup screen and end by itself.
      # The same selection as the step for checks, so the core is built once.
      - name: Loopback call of the release build
        if: inputs.release_tag != ''
        timeout-minutes: 20
        env:
          GELABBER_EXPECT_H264: "1"
        run: cargo test --locked --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture --test-threads=1

      - name: Native app smoke test
        timeout-minutes: 10
        run: |
          cargo build --locked --manifest-path desktop/Cargo.toml -p gelabber
          desktop/packaging/native/smoke.sh desktop/target/debug/gelabber 10

      # The script also checks both files (C++ runtime, exports, rpath).
      - name: Package the native app
        if: inputs.package
        run: |
          set -euo pipefail
          lib="$(realpath "$(find desktop/target -name libgelabber_media.so -path '*/out/build/*' | head -n1)")"
          desktop/packaging/native/tarball.sh "$lib"

      - name: Upload the native app
        if: inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-linux-x64
          path: gelabber-native-linux-x64.tar.gz
          retention-days: 14

      - name: Check and measure the core library
        run: |
          set -euo pipefail
          # Absolute: cargo runs rustc from the workspace, not from here.
          lib="$(realpath "$(find desktop/target -name libgelabber_media.so -path '*/out/build/*' | head -n1)")"
          desktop/packaging/native/check-core.sh --summary "$GITHUB_STEP_SUMMARY" "$lib"

  # The app's THIRD-PARTY-NOTICES.txt must match desktop/Cargo.lock and the
  # build configuration (desktop/packaging/third-party-notices.py writes
  # it). The release uploads wait for this job.
  notices:
    name: Third-party notices
    if: inputs.prebuilt_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)

      - name: Notices are current
        run: python3 desktop/packaging/third-party-notices.py --check

      # The native installer is built after merge only; its script compiles here.
      - name: NSIS for the installer test
        timeout-minutes: 5
        run: .github/workflows/scripts/apt-install.sh nsis

      # test_release_wiring.py reads the workflows with the deployment tests' pinned PyYAML.
      - name: PyYAML for the tests
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: \
            --target "$RUNNER_TEMP/python" -r deploy/compose/tests/requirements.txt

      # After the check, which fetched the lock file's crates: one test runs the
      # script again offline and, in CI, fails where it cannot.
      - name: Tests of the packaging scripts
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ runner.temp }}/python
        run: python3 -m unittest discover -s desktop/packaging/tests -v

      # shellcheck and PSScriptAnalyzer at the versions lint.sh pins (SHA-256), not the runner image's.
      - name: Lint the packaging scripts
        if: ${{ !cancelled() }}
        run: desktop/packaging/lint.sh --install "$RUNNER_TEMP/lint-tools"

  # Windows in the release profile (the DLL that ships): core, app and checks;
  # after merge also the installer, installed, updated and removed.
  core-windows:
    name: Native core and app (Windows x64)
    needs: libwebrtc-windows
    if: inputs.prebuilt_run == ''
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      GELABBER_LIBWEBRTC_DIR: C:\libwebrtc-package
      # mediasoup-sys (the worker the core's tests call) runs "$PYTHON -m invoke".
      PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version for the installer (a release must carry its tag's), and the
      # build settings (static C runtime) before anything is built or cached.
      - name: Version and build settings
        shell: bash
        run: |
          set -euo pipefail
          version="$(desktop/packaging/native/version.sh --tag "$RELEASE_TAG")"
          echo "DESKTOP_VERSION=$version" | tee -a "$GITHUB_ENV"
          tr -d '\r' < desktop/native/windows-build.env | grep -Ev '^(#|$)' | tee -a "$GITHUB_ENV"

      - name: Restore libwebrtc package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ needs.libwebrtc-windows.outputs.key }}
          fail-on-cache-miss: true

      # For the mediasoup worker's build (Meson).
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # mediasoup-sys's PYTHONPATH loses its drive letter (cargo registry on C:,
      # target on D:), so invoke is installed here.
      - name: Python packages for the mediasoup worker
        run: |
          $requirements = Join-Path $env:RUNNER_TEMP invoke-requirements.txt
          'invoke==3.0.3 --hash=sha256:f11327165e5cbb89b2ad1d88d3292b5113332c43b8553b494da435d6ec6f5053' | Set-Content $requirements
          python -m pip install --require-hashes --only-binary=:all: -r $requirements

      - name: Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0 (branch)
        with:
          components: rustfmt, clippy

      # MSVC stops at 260 characters: a short target directory two levels above
      # the checkout. clang-cl compiles, Visual Studio's libraries link.
      - name: Build tools and target directory
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\..\t'))
          Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$target"
          "target directory: $target"
          cmake --version
          ninja --version
          clang-cl --version
          python --version
          node --version
          cargo --version --verbose

      # Written once per key by the first push run without it, never refreshed:
      # it must hold the release dependencies and the tests' mediasoup worker.
      # Raise `key` to start over. MESON_ARGS is in the key because the worker's
      # build script does not tell cargo it reads it. Pull requests only read.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> ../../../t
          key: "1"
          env-vars: MESON_ARGS
          save-if: ${{ github.event_name == 'push' }}

      # Release runs use desktop/packaging/updater.pub; every other run makes
      # its own key, so its installer is signed and checked the same way.
      - name: Updater key
        run: ./desktop/packaging/native/windows/updater-key.ps1

      # The C++ core alone first: its compile and link errors come up before
      # the long Rust builds.
      - name: Native core (gelabber_media.dll)
        id: core
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core

      # The app (desktop/gelabber); its build script puts gelabber_media.dll
      # next to the binary.
      - name: Native app (gelabber.exe)
        id: native
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml -p gelabber

      # The native app's installer from its own NSIS script; NSIS of the image.
      - name: Native installer
        id: native-installer
        if: ${{ !cancelled() && inputs.package && steps.native.outcome == 'success' }}
        timeout-minutes: 15
        run: ./desktop/packaging/native/windows/build-installer.ps1

      # The updater signature (<installer>.sig, bound to the version), with the
      # key in desktop/packaging/updater.pub. Only release runs from the tag see it.
      - name: Sign the native update
        id: native-sign
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' && !inputs.candidate }}
        timeout-minutes: 10
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./desktop/packaging/native/windows/sign-update.ps1

      # The native app's own check of that signature, with the key it was
      # built with: a release key that is not updater.pub stops the release.
      - name: Native update signature
        if: ${{ !cancelled() && steps.native-sign.outcome == 'success' }}
        timeout-minutes: 20
        env:
          GELABBER_NATIVE_UPDATE_TEST_INSTALLER: ${{ format('{0}\gelabber-native-windows-x64-setup.exe', github.workspace) }}
        run: cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber -- the_installer_built_here --test-threads=1

      # The setup as a user runs it, then as the app's updater does (shortcuts
      # kept, the app restarted with its arguments), then the uninstaller.
      - name: Install, update and remove like a user
        id: native-install
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' }}
        timeout-minutes: 15
        run: ./desktop/packaging/native/windows/install-test.ps1

      - name: Upload the native app
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' && (steps.native-sign.outcome == 'success' || inputs.candidate) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-windows-x64
          path: |
            gelabber-native-windows-x64-setup.exe
            gelabber-native-windows-x64-setup.exe.sha256
            gelabber-native-windows-x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

      # The native app on the runner's desktop for a few seconds, as on Linux
      # (GELABBER_SMOKE): exit status 0 once it painted its setup screen.
      - name: Native app smoke test
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 5
        run: ./desktop/packaging/native/windows/smoke.ps1

      # What ships, read with dumpbin: exports, H264 code and what a clean
      # Windows lacks (the script says which).
      - name: Check and measure the binaries
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: ./desktop/packaging/native/windows/check-binaries.ps1

      # The core's tests, built and not yet run: the mediasoup worker they
      # call (a dev-dependency; Meson and C++, some ten minutes) and the test
      # programs. A step of its own, so that the next one knows whether the
      # worker is there.
      - name: Tests of the core with their mediasoup worker (build)
        id: worker
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        timeout-minutes: 45
        run: cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --no-run

      # From here on both long builds exist, so a failing run still saves its
      # cache (rust-cache's post step reads this variable).
      - name: Rust cache also from a run that fails from here on
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.worker.outcome == 'success' }}
        run: Add-Content $env:GITHUB_ENV 'CACHE_ON_FAILURE=true'

      # libwebrtc sends from the machine's address, which Windows may not route
      # to 127.0.0.1: the script moves the tests' server if needed.
      - name: Address for the loopback call
        if: ${{ !cancelled() && steps.core.outcome == 'success' }}
        run: ./desktop/packaging/native/windows/loopback-address.ps1

      # The Linux job's call through an in-process mediasoup worker. H264 only
      # where Media Foundation has codecs, so no GELABBER_EXPECT_H264.
      # GELABBER_TEST_SCREEN_MONITOR captures the primary monitor without the
      # picker; where Windows cannot capture, the test fails in CI. A release build
      # makes the call alone, without the tests that measure frame rates.
      - name: Loopback call against mediasoup 0.33
        id: tests
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 20
        env:
          RUST_BACKTRACE: "1"
          GELABBER_TEST_SCREEN_MONITOR: "1"
        run: |
          $only = if ($env:RELEASE_TAG) { @('--test', 'mediasoup_loopback') } else { @() }
          cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core @only -- --nocapture --test-threads=1

      # A native crash ends the test without a word; libwebrtc's log says
      # where it got to, and how far ICE came on the address chosen above.
      # Never fails by itself.
      - name: Loopback call with libwebrtc logs
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        timeout-minutes: 10
        env:
          GELABBER_MEDIA_LOG: "1"
          RUST_BACKTRACE: "1"
          GELABBER_TEST_SCREEN_MONITOR: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --test mediasoup_loopback --test screen_capture -- --nocapture --test-threads=1
          exit 0

      # The UI's platform tests (tray, toasts, push-to-talk hook, paths) on the
      # system they are written for; no GPU, no core. Without `media`, the call
      # crate's test of a call without the core compiles here, and nowhere else.
      - name: Platform tests of the app
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-ui -p gelabber-call --lib -- platform:: tests::without_the_core_a_call_says_why --test-threads=1

      # The core alone: with the app, features unify and the worker rebuilds.
      # The empty core directory keeps the build scripts from compiling the C++ again.
      - name: Clippy
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GELABBER_MEDIA_LIB_DIR = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'no-core')).FullName
          cargo clippy --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --all-targets -- -D warnings
          cargo clippy --release --locked --manifest-path desktop/Cargo.toml -p gelabber -p gelabber-ui -p gelabber-call -p gelabber-client -p gelabber-i18n --all-targets -- -D warnings

  # A release whose pull request packaged its apps (candidate, GEL-358): the
  # installer gets the release key's signature here, and nothing built runs.
  prebuilt:
    name: Sign the release's prebuilt apps
    if: inputs.prebuilt_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the candidate's Linux app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-linux-x64
          path: linux
          run-id: ${{ inputs.prebuilt_run }}
          github-token: ${{ github.token }}

      - name: Download the candidate's Windows app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-windows-x64
          path: windows
          run-id: ${{ inputs.prebuilt_run }}
          github-token: ${{ github.token }}

      # As in core-windows: only the released source gets the release key's
      # signature, bound to the version the app carries.
      - name: Sign the native update
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ] || [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "release ${RELEASE_TAG:-?} must be signed from its tag, not $GITHUB_REF"; exit 1
          fi
          version="$(desktop/packaging/native/version.sh --tag "$RELEASE_TAG")"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "release $RELEASE_TAG: the secret TAURI_SIGNING_PRIVATE_KEY is not set, so the update cannot be signed (desktop/README.md, Updates)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd windows
          sha256sum --check gelabber-native-windows-x64-setup.exe.sha256
          rm -f gelabber-native-windows-x64-setup.exe.sig
          npx --yes '@tauri-apps/cli@2.12.3' signer sign --app-version "$version" gelabber-native-windows-x64-setup.exe

      # The app's own check of the signature (update.rs `verify`), with
      # updater.pub: a release key that is not that key stops the release.
      - name: Native update signature
        env:
          VERSION: ${{ steps.sign.outputs.version }}
        run: |
          set -euo pipefail
          .github/workflows/scripts/apt-install.sh python3-cryptography
          /usr/bin/python3 .github/workflows/scripts/update_signature.py \
            windows/gelabber-native-windows-x64-setup.exe windows/gelabber-native-windows-x64-setup.exe.sig \
            desktop/packaging/updater.pub "$VERSION"

      - name: Upload the Linux app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-linux-x64
          path: linux/gelabber-native-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-windows-x64
          path: |
            windows/gelabber-native-windows-x64-setup.exe
            windows/gelabber-native-windows-x64-setup.exe.sha256
            windows/gelabber-native-windows-x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  # The pacman repository (Arch/Omarchy): package, signed database, a user's
  # install, upgrade and removal. Publishing is separate.
  arch-repo:
    name: Arch package and repository
    if: >-
      !cancelled() && inputs.package && !inputs.candidate &&
      (needs.core-linux.result == 'success' || needs.prebuilt.result == 'success')
    needs: [core-linux, prebuilt]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      # Releases sign with the repository key; everything else with a
      # throwaway key that only this job trusts.
      ARCH_REPO_GPG_KEY: ${{ inputs.release_tag != '' && secrets.ARCH_REPO_GPG_KEY || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the native app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-linux-x64

      # Xvfb, lavapipe and the X11 libraries winit loads, for the native app's
      # start after its install.
      - name: Check PKGBUILD and .SRCINFO
        run: |
          pacman -Syu --noconfirm --needed git xorg-server-xvfb xorg-xauth vulkan-swrast \
            libxkbcommon-x11 libxcursor libxrandr libxi
          useradd -m builder
          cp -r desktop/packaging/arch /tmp/arch && chown -R builder /tmp/arch
          cd /tmp/arch/native
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Build package and repository
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PUBLISH: ${{ vars.ARCH_REPO_PUBLISH }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            # The package must be built from the released source.
            if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
              echo "release $TAG must be built from its tag, not $GITHUB_REF"; exit 1
            fi
            if [ "$PUBLISH" = true ] && [ -z "$ARCH_REPO_GPG_KEY" ]; then
              echo "ARCH_REPO_PUBLISH is on but the ARCH_REPO_GPG_KEY secret is missing"; exit 1
            fi
            # The package gets its version from the tag, the app in it from the
            # desktop workspace: the same, or the release is not built.
            desktop/packaging/native/version.sh --tag "$TAG" >/dev/null
            version="$TAG"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gelabber-native-linux-x64.tar.gz"
          else
            # Test builds: the workspace version plus the run number.
            version="$(desktop/packaging/native/version.sh).r${GITHUB_RUN_NUMBER}"
            url=""
          fi
          desktop/packaging/arch/repo.sh build "$version" gelabber-native-linux-x64.tar.gz site $url
          cp desktop/packaging/arch/README.md site/README.md

      - name: Install, upgrade and remove like a user
        run: desktop/packaging/arch/repo.sh test site gelabber-native-linux-x64.tar.gz

      # The repository as built before the upgrade test added a newer pkgrel.
      - name: Rebuild the repository for upload
        if: inputs.release_tag != ''
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          rm -rf site
          desktop/packaging/arch/repo.sh build "$TAG" gelabber-native-linux-x64.tar.gz site \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gelabber-native-linux-x64.tar.gz"
          cp desktop/packaging/arch/README.md site/README.md

      - name: Upload the repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-repo
          path: site
          retention-days: 14
