# Desktop app for Linux and Windows: libwebrtc builds (cached), the native
# core with a loopback call against mediasoup and the packaged app. ci.yml
# calls it for pull requests and pushes, desktop-release.yml for a release.
name: Desktop native core

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release to build for (signing keys, pacman repository); empty for checks
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  libwebrtc-linux:
    name: libwebrtc (Linux x64)
    runs-on: ubuntu-24.04
    # GitHub's limit: the build plus the renewal of the notices after it.
    timeout-minutes: 360
    # Outside pull requests a new package is stored in a release.
    permissions:
      contents: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache key
        id: key
        run: |
          echo "key=libwebrtc-linux-x64-${{ hashFiles('desktop/native/libwebrtc.env', 'desktop/native/scripts/build-libwebrtc-linux.sh', 'desktop/native/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Restore libwebrtc package
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # The cache is evicted under the quota; the libwebrtc-packages release
      # keeps every package, so a miss costs a download, not a build.
      - name: Fetch the stored package
        id: stored
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/libwebrtc-package /mnt/libwebrtc-fetch
          sudo chown -R "$USER" /mnt/libwebrtc-package /mnt/libwebrtc-fetch
          if gh release download libwebrtc-packages --repo "$GITHUB_REPOSITORY" \
            --pattern "$KEY.tar.zst" --dir /mnt/libwebrtc-fetch; then
            tar --zstd -xf "/mnt/libwebrtc-fetch/$KEY.tar.zst" -C /mnt/libwebrtc-package
            test -f /mnt/libwebrtc-package/lib/libwebrtc.a
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          rm -rf /mnt/libwebrtc-fetch

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          sudo mkdir -p /mnt/webrtc /mnt/libwebrtc-package
          sudo chown -R "$USER" /mnt/webrtc /mnt/libwebrtc-package
          df -h / /mnt

      - name: Build libwebrtc
        id: build
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          desktop/native/scripts/build-libwebrtc-linux.sh /mnt/webrtc /mnt/libwebrtc-package
          minutes=$(( (SECONDS - start) / 60 ))
          {
            echo "### libwebrtc (Linux x64)"
            echo
            echo "Build time: ${minutes} min"
            echo
            echo '```'
            cat /mnt/libwebrtc-package/VERSIONS
            du -sh /mnt/libwebrtc-package/lib/libwebrtc.a /mnt/libwebrtc-package/include /mnt/libwebrtc-package/toolchain /mnt/libwebrtc-package/sysroot
            du -sh /mnt/webrtc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / /mnt

      - name: Save libwebrtc package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ steps.key.outputs.key }}

      - name: Is the package stored?
        id: asset
        if: github.event_name != 'pull_request' && steps.stored.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          if ! names=$(gh release view libwebrtc-packages --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            echo "::warning::The libwebrtc-packages release is missing, so the package is not stored."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$names" | grep -qxF "$KEY.tar.zst"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the package directory to store it
        if: steps.asset.outputs.missing == 'true' && steps.cache.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /mnt/libwebrtc-package
          sudo chown -R "$USER" /mnt/libwebrtc-package

      - name: Restore the package to store it
        if: steps.asset.outputs.missing == 'true' && steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true

      - name: Store the package
        if: steps.asset.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/libwebrtc-store
          sudo chown "$USER" /mnt/libwebrtc-store
          tar -I 'zstd -T0' -cf "/mnt/libwebrtc-store/$KEY.tar.zst" -C /mnt/libwebrtc-package .
          ls -l "/mnt/libwebrtc-store/$KEY.tar.zst"
          # A run beside this one may have stored it first.
          gh release upload libwebrtc-packages "/mnt/libwebrtc-store/$KEY.tar.zst" --repo "$GITHUB_REPOSITORY" \
            || gh release view libwebrtc-packages --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$KEY.tar.zst"

      # A new libwebrtc build renews part 2 of the third-party notices: the step
      # summary says whether it changed, the artifact holds the file to commit.
      - name: Rust toolchain (notices)
        if: steps.build.outcome == 'success'
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)

      - name: Renew the third-party notices
        id: notices
        if: steps.build.outcome == 'success'
        env:
          GELABBER_LIBWEBRTC_DIR: /mnt/libwebrtc-package
        run: |
          set -euo pipefail
          .github/workflows/scripts/apt-install.sh ninja-build python3-venv
          cargo build --manifest-path desktop/Cargo.toml -p gelabber-media-core
          build=$(ls -d desktop/target/debug/build/gelabber-media-core-*/out/build | head -n 1)
          python3 desktop/packaging/third-party-notices.py --webrtc-src /mnt/webrtc/src --core-build "$build"
          notices=desktop/packaging/native/THIRD-PARTY-NOTICES.txt
          if git diff --quiet -- "$notices"; then
            echo "Third-party notices ($notices): unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Third-party notices ($notices): renewed, $(git diff --numstat -- "$notices" | awk '{print "+" $1 " -" $2}') lines; commit the artifact third-party-notices." >> "$GITHUB_STEP_SUMMARY"
            echo "::group::diff of $notices (gzip, base64)"
            git diff -- "$notices" | gzip -9 | base64 -w 0
            echo
            echo "::endgroup::"
          fi

      - name: Upload the renewed notices
        if: steps.notices.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: desktop/packaging/native/THIRD-PARTY-NOTICES.txt

  libwebrtc-windows:
    name: libwebrtc (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 330
    # Outside pull requests a new package is stored in a release.
    permissions:
      contents: write
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "key=libwebrtc-windows-x64-${{ hashFiles('desktop/native/libwebrtc.env', 'desktop/native/scripts/build-libwebrtc-windows.ps1', 'desktop/native/patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Restore libwebrtc package
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # As on Linux: the release keeps what the cache loses. Windows' own tar
      # takes C:\ paths, which Git's does not.
      - name: Fetch the stored package
        id: stored
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          $fetch = Join-Path $env:RUNNER_TEMP libwebrtc-fetch
          New-Item -ItemType Directory -Force C:\libwebrtc-package, $fetch | Out-Null
          gh release download libwebrtc-packages --repo $env:GITHUB_REPOSITORY --pattern "$($env:KEY).tar.gz" --dir $fetch
          if ($LASTEXITCODE -eq 0) {
            & "$env:SystemRoot\System32\tar.exe" -xzf (Join-Path $fetch "$($env:KEY).tar.gz") -C C:\libwebrtc-package
            if ($LASTEXITCODE -ne 0) { throw "the stored package does not unpack" }
            if (-not (Test-Path C:\libwebrtc-package\lib\webrtc.lib)) { throw "the stored package has no webrtc.lib" }
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
          }
          Remove-Item -Recurse -Force $fetch
          $global:LASTEXITCODE = 0

      - name: Python
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build libwebrtc
        if: steps.cache.outputs.cache-hit != 'true' && steps.stored.outputs.found != 'true'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $start = Get-Date
          ./desktop/native/scripts/build-libwebrtc-windows.ps1 -Work C:\webrtc -Package C:\libwebrtc-package
          $minutes = [int]((Get-Date) - $start).TotalMinutes
          $lib = Get-Item C:\libwebrtc-package\lib\webrtc.lib
          @(
            "### libwebrtc (Windows x64)", "",
            "Build time: $minutes min", "",
            "webrtc.lib: $([math]::Round($lib.Length / 1MB)) MiB"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Save libwebrtc package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ steps.key.outputs.key }}

      - name: Is the package stored?
        id: asset
        if: github.event_name != 'pull_request' && steps.stored.outputs.found != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          if ! names=$(gh release view libwebrtc-packages --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            echo "::warning::The libwebrtc-packages release is missing, so the package is not stored."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$names" | grep -qxF "$KEY.tar.gz"; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the package to store it
        if: steps.asset.outputs.missing == 'true' && steps.cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true

      - name: Store the package
        if: steps.asset.outputs.missing == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$($env:KEY).tar.gz"
          & "$env:SystemRoot\System32\tar.exe" -czf $archive -C C:\libwebrtc-package .
          if ($LASTEXITCODE -ne 0) { throw "the package does not pack" }
          Get-Item $archive | Select-Object Name, Length
          gh release upload libwebrtc-packages $archive --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            # A run beside this one may have stored it first.
            $names = gh release view libwebrtc-packages --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            if ($names -notcontains "$($env:KEY).tar.gz") { throw "the package was not stored" }
          }
          $global:LASTEXITCODE = 0

  core-linux:
    name: Native core (Linux x64)
    needs: libwebrtc-linux
    # A newer push to a pull request cancels this job of the older run (ci.yml
    # cancels the whole run, libwebrtc included). Branch runs are never cancelled.
    concurrency:
      group: desktop-core-linux-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GELABBER_LIBWEBRTC_DIR: /mnt/libwebrtc-package
      # Build scripts get debug info too; otherwise `cargo test --test <name>`
      # rebuilds quote/syn and a second mediasoup worker (~6 min).
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare package directory
        run: sudo mkdir -p /mnt/libwebrtc-package && sudo chown -R "$USER" /mnt/libwebrtc-package

      - name: Restore libwebrtc package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/libwebrtc-package
          key: ${{ needs.libwebrtc-linux.outputs.key }}
          fail-on-cache-miss: true

      # Xvfb and lavapipe for the app's smoke test, gdb for the voice test's
      # backtrace. apt-install.sh leaves a slow Ubuntu mirror for another one.
      - name: Build tools
        timeout-minutes: 15
        run: |
          .github/workflows/scripts/apt-install.sh ninja-build python3-venv \
            xvfb xauth mesa-vulkan-drivers gdb

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)
        with:
          components: rustfmt, clippy

      # The mediasoup worker (dev-dependency) takes minutes to build.
      # Written by pushes to main and the release branches, read by pull
      # requests: a copy per pull request (some 2.7 GB) pushed the
      # repository past its cache quota and evicted the others.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          save-if: ${{ github.event_name == 'push' }}

      # A release is built from a commit CI has tested on main, so its build
      # runs no checks again: a flaky one would hold the release back.
      - name: Format
        if: inputs.release_tag == ''
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Clippy
        if: inputs.release_tag == ''
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      # GStreamer and the test desktop (PipeWire, pipewire-pulse,
      # xdg-desktop-portal). x264enc and avdec_h264 (av1enc and av1dec for
      # AV1) stand in for VA-API/NVENC/NVDEC, which runners lack, to test the
      # GStreamer encoder and decoder paths themselves.
      - name: Test packages
        timeout-minutes: 15
        run: |
          .github/workflows/scripts/apt-install.sh pipewire wireplumber pipewire-pulse \
            pulseaudio-utils xdg-desktop-portal \
            libpipewire-0.3-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav python3-gi

      # Every test of the workspace. This core is built with H264, so the
      # loopback call must use it.
      - name: Loopback call against mediasoup 0.29
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
        run: cargo test --manifest-path desktop/Cargo.toml -- --nocapture --test-threads=1

      - name: Loopback call with the GStreamer H264 encoder
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_H264_ENCODER: x264enc
          GELABBER_EXPECT_ENCODER: GStreamer x264enc
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      - name: Loopback call with the GStreamer H264 decoder
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_H264_DECODER: avdec_h264
          GELABBER_EXPECT_DECODER: GStreamer avdec_h264
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # AV1 through GStreamer in front of libaom and dav1d: av1enc and av1dec
      # (libaom in gst-plugins-bad) stand in for NVENC/VA-API/NVDEC.
      - name: Loopback call with GStreamer AV1 codecs
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_AV1_ENCODER: av1enc
          GELABBER_EXPECT_AV1_ENCODER: GStreamer av1enc
          GELABBER_AV1_DECODER: av1dec
          GELABBER_EXPECT_AV1_DECODER: GStreamer av1dec
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # System AV1 codecs that fail: identity as the encoder hands raw
      # pictures to av1parse, which refuses them once the call runs; as the
      # decoder it cannot link AV1 to videoconvert, so it does not start.
      # libaom and dav1d take over.
      - name: Loopback call with failing GStreamer AV1 codecs
        if: inputs.release_tag == ''
        env:
          GELABBER_EXPECT_H264: "1"
          GELABBER_AV1_ENCODER: identity
          GELABBER_EXPECT_AV1_ENCODER: libaom
          GELABBER_AV1_DECODER: identity
          GELABBER_EXPECT_AV1_DECODER: dav1d
          GELABBER_MEDIA_LOG: "1"
        run: cargo test --manifest-path desktop/Cargo.toml --test mediasoup_loopback -- --nocapture

      # Real xdg-desktop-portal frontend and PipeWire, with a test backend
      # whose monitor is a shared-memory test stream (no compositor or GPU here).
      - name: Screen capture through the ScreenCast portal
        if: inputs.release_tag == ''
        timeout-minutes: 15
        env:
          GELABBER_TEST_SCREEN: "1"
          GELABBER_MEDIA_LOG: "1"
          GELABBER_H264_ENCODER: x264enc
          GELABBER_EXPECT_ENCODER: GStreamer x264enc
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --manifest-path desktop/Cargo.toml --test screen_capture -- --nocapture

      # libwebrtc's PulseAudio device module on pipewire-pulse: white noise
      # from a null sink's monitor as the microphone, another null sink as
      # the speakers. Covers device selection, the three processing modes
      # (RNNoise included), Opus through mediasoup and playout.
      - name: Voice through PulseAudio devices
        if: inputs.release_tag == ''
        id: voice
        timeout-minutes: 10
        env:
          GELABBER_TEST_AUDIO: "1"
          GELABBER_MEDIA_LOG: "1"
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --manifest-path desktop/Cargo.toml --test voice -- --nocapture

      # A native abort kills the test without a Rust backtrace.
      - name: Voice test backtrace
        if: failure() && steps.voice.outcome == 'failure'
        timeout-minutes: 10
        env:
          GELABBER_TEST_AUDIO: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/desktop/native/scripts/gdb-backtrace.sh
        run: |
          desktop/native/scripts/fake-desktop-session.sh \
            cargo test --manifest-path desktop/Cargo.toml --test voice -- --nocapture || true

      # The native app (desktop/gelabber) on lavapipe under Xvfb, no server and
      # empty settings: it must paint its setup screen and end by itself.
      - name: Native app smoke test
        timeout-minutes: 10
        run: |
          cargo build --manifest-path desktop/Cargo.toml -p gelabber
          desktop/packaging/native/smoke.sh desktop/target/debug/gelabber 10

      # Packaging runs after merge (main/v*) and for releases, not per PR.
      # The script also checks both files (C++ runtime, exports, rpath).
      - name: Package the native app
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          lib="$(realpath "$(find desktop/target -name libgelabber_media.so -path '*/out/build/*' | head -n1)")"
          desktop/packaging/native/tarball.sh "$lib"

      - name: Upload the native app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-linux-x64
          path: gelabber-native-linux-x64.tar.gz
          retention-days: 14

      - name: Check and measure the core library
        run: |
          set -euo pipefail
          # Absolute: cargo runs rustc from the workspace, not from here.
          lib="$(realpath "$(find desktop/target -name libgelabber_media.so -path '*/out/build/*' | head -n1)")"
          test -f "$lib"
          test -n "$lib"
          echo "Dynamic dependencies:"
          readelf -d "$lib" | grep NEEDED | tee /tmp/needed.txt
          # Chromium's libc++ is linked in and hidden; no system C++ runtime.
          if grep -E 'libstdc\+\+|libc\+\+' /tmp/needed.txt; then
            echo "core must not depend on a shared C++ runtime"; exit 1
          fi
          exported="$(nm -D --defined-only "$lib" | awk '{print $3}' | sort)"
          echo "$exported"
          if echo "$exported" | grep -v '^gm_'; then
            echo "only gm_* symbols may be exported"; exit 1
          fi
          # libwebrtc is built with rtc_use_h264=false: no OpenH264, FFmpeg or
          # libwebrtc's wrappers around them in the symbol table.
          if nm -C "$lib" | grep -E 'WelsInitEncoderExt|CWelsH264SVCEncoder|H264EncoderImpl|H264DecoderImpl|avcodec_open2|ff_h264_decoder'; then
            echo "the core carries H264 code of OpenH264 or FFmpeg"; exit 1
          fi
          stripped="$(mktemp)"
          strip --strip-unneeded -o "$stripped" "$lib"
          {
            echo "### Native core (Linux x64)"
            echo
            echo "| file | size |"
            echo "|---|---|"
            echo "| libgelabber_media.so | $(du -h "$lib" | cut -f1) |"
            echo "| libgelabber_media.so (stripped) | $(du -h "$stripped" | cut -f1) |"
            echo "| gzip (stripped) | $(gzip -9 -c "$stripped" | wc -c | numfmt --to=iec) |"
            echo
            echo '```'
            cat /tmp/needed.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The app's THIRD-PARTY-NOTICES.txt must match desktop/Cargo.lock and the
  # build configuration (desktop/packaging/third-party-notices.py writes
  # it). The release uploads wait for this job.
  notices:
    name: Third-party notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)

      - name: Notices are current
        run: python3 desktop/packaging/third-party-notices.py --check

      # The native installer is built after merge only; its script compiles here.
      - name: NSIS for the installer test
        timeout-minutes: 5
        run: .github/workflows/scripts/apt-install.sh nsis

      # After the check, which has fetched the crates of the lock file: one
      # of the tests runs the script again without the network and, in CI,
      # fails where it cannot (elsewhere it skips).
      - name: Tests of the packaging scripts
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s desktop/packaging/tests -v

  # Windows in the release profile (the DLL that ships): core, app and checks;
  # after merge also the installer, over the Tauri app, started and removed.
  core-windows:
    name: Native core and app (Windows x64)
    needs: libwebrtc-windows
    # As core-linux: a newer push to a pull request cancels the older run's.
    concurrency:
      group: desktop-core-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      GELABBER_LIBWEBRTC_DIR: C:\libwebrtc-package
      # mediasoup-sys (the worker the core's tests call) runs "$PYTHON -m invoke".
      PYTHON: python
      # Static C runtime, so the app starts without the VC++ redistributable;
      # --vsenv is mediasoup's default and must stay when MESON_ARGS is set.
      RUSTFLAGS: -C target-feature=+crt-static
      MESON_ARGS: --vsenv -Db_vscrt=mt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore libwebrtc package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\libwebrtc-package
          key: ${{ needs.libwebrtc-windows.outputs.key }}
          fail-on-cache-miss: true

      # For the mediasoup worker's build (Meson).
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # mediasoup-sys's PYTHONPATH loses its drive letter (cargo registry on C:,
      # target on D:), so invoke is installed here.
      - name: Python packages for the mediasoup worker
        run: python -m pip install invoke==3.0.3

      - name: Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1 (branch)
        with:
          components: rustfmt, clippy

      # MSVC stops at 260 characters: a short target directory two levels above
      # the checkout. clang-cl compiles, Visual Studio's libraries link.
      - name: Build tools and target directory
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\..\t'))
          Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$target"
          "target directory: $target"
          cmake --version
          ninja --version
          clang-cl --version
          python --version
          node --version
          cargo --version --verbose

      # Written once per key by the first push run without it, never refreshed:
      # it must hold the release dependencies and the tests' mediasoup worker.
      # Raise `key` to start over. MESON_ARGS is in the key because the worker's
      # build script does not tell cargo it reads it. Pull requests only read.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> ../../../t
          key: "1"
          env-vars: MESON_ARGS
          save-if: ${{ github.event_name == 'push' }}

      # Release runs use desktop/packaging/updater.pub; every other run makes
      # its own key, so its installer is signed and checked the same way.
      - name: Updater key
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG) {
            # Before anything is signed with the release key: only the
            # released source gets its signature, one installer per version.
            if ($env:GITHUB_REF -ne "refs/tags/$($env:RELEASE_TAG)") {
              throw "release $($env:RELEASE_TAG) must be built from its tag, not $($env:GITHUB_REF)"
            }
            $pub = 'desktop\packaging\updater.pub'
            if (-not (Test-Path $pub) -or -not (Get-Content -Raw $pub).Trim()) {
              throw "release $($env:RELEASE_TAG): $pub is missing, and with it the key the app checks updates with (desktop/README.md, Updates)"
            }
            "release: the key of $pub"
          } else {
            $key = Join-Path $env:RUNNER_TEMP 'updater-test.key'
            npx.cmd --yes '@tauri-apps/cli@2.12.3' signer generate --ci --password test --write-keys $key --force
            Add-Content $env:GITHUB_ENV "GELABBER_UPDATER_PUBKEY=$((Get-Content -Raw "$key.pub").Trim())"
            Add-Content $env:GITHUB_ENV "GELABBER_UPDATER_TEST_KEY=$key"
            "test key: $key"
          }

      # The C++ core alone first: its compile and link errors come up before
      # the long Rust builds.
      - name: Native core (gelabber_media.dll)
        id: core
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core

      # The app (desktop/gelabber); its build script puts gelabber_media.dll
      # next to the binary.
      - name: Native app (gelabber.exe)
        id: native
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml -p gelabber

      # The native app's installer from its own NSIS script, after merge and
      # for releases only (as the Linux packages); NSIS of the image.
      - name: Native installer
        id: native-installer
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.native.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) {
            choco install nsis --yes --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          & $makensis /VERSION
          $version = (Select-String -Path desktop\Cargo.toml -Pattern '^version = "(.+)"\s*$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") {
            throw "release $($env:RELEASE_TAG): desktop\Cargo.toml, and with it the app, says $version"
          }
          $release = Join-Path $env:CARGO_TARGET_DIR 'release'
          $stage = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'native-installer')).FullName
          Copy-Item (Join-Path $release 'gelabber.exe'), (Join-Path $release 'gelabber_media.dll') $stage
          Copy-Item desktop\packaging\icons\icon.ico, desktop\packaging\icons\icon.png, desktop\packaging\native\THIRD-PARTY-NOTICES.txt $stage
          Copy-Item desktop\packaging\native\README-windows.txt (Join-Path $stage 'README.txt')
          $name = 'gelabber-native-windows-x64-setup.exe'
          # Windows wants four numbers in the file version: no pre-release part.
          $numeric = "$(($version -split '[-+]')[0]).0"
          & $makensis /V3 "/DVERSION=$version" "/DFILEVERSION=$numeric" "/DSOURCE=$stage" "/DOUTFILE=$(Join-Path $PWD $name)" desktop\packaging\native\windows\installer.nsi
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "$name.sha256"), "$hash  $name`n")
          @(
            '### Native app (Windows x64)', '',
            '| file | size | sha256 |', '|---|---|---|',
            "| $name | $([math]::Round((Get-Item $name).Length / 1MB, 1)) MiB | $hash |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      # The updater signature (<installer>.sig, bound to the version), with the
      # key the 0.8 Tauri apps check too. Only release runs from the tag see it.
      - name: Sign the native update
        id: native-sign
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' }}
        timeout-minutes: 10
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_tag != '' && github.ref == format('refs/tags/{0}', inputs.release_tag) && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $name = 'gelabber-native-windows-x64-setup.exe'
          $version = (Select-String -Path desktop\Cargo.toml -Pattern '^version = "(.+)"\s*$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG) {
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              throw "release $($env:RELEASE_TAG): the secret TAURI_SIGNING_PRIVATE_KEY is not set, so the update cannot be signed (desktop/README.md, Updates)"
            }
            npx.cmd --yes '@tauri-apps/cli@2.12.3' signer sign --app-version $version $name
          } else {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            npx.cmd --yes '@tauri-apps/cli@2.12.3' signer sign --app-version $version --private-key-path $env:GELABBER_UPDATER_TEST_KEY --password test $name
          }
          if (-not (Test-Path "$name.sig")) { throw "no signature $name.sig" }

      # The native app's own check of that signature, with the key it was
      # built with: a release key that is not updater.pub stops the release.
      - name: Native update signature
        if: ${{ !cancelled() && steps.native-sign.outcome == 'success' }}
        timeout-minutes: 20
        env:
          GELABBER_NATIVE_UPDATE_TEST_INSTALLER: ${{ format('{0}\gelabber-native-windows-x64-setup.exe', github.workspace) }}
        run: cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber -- the_installer_built_here --test-threads=1

      # An installed 0.8 app's switch per Tauri release: its WebView filled by the
      # fixture page, this setup with its updater's arguments, the import checked.
      - name: Install over the Tauri app and remove like a user
        id: native-install
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' }}
        timeout-minutes: 25
        env:
          # 0.8.9 leaves no export (the WebView is read), 0.8.10 exports (only that is read).
          TAURI_RELEASES: v0.8.9 v0.8.10
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $id = 'io.github.till-und-scholler-ai-slop.gelabber'
          $install = Join-Path $env:LOCALAPPDATA 'Gelabber'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Gelabber.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Gelabber.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Gelabber'
          $version = (Select-String -Path desktop\Cargo.toml -Pattern '^version = "(.+)"\s*$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $config = Join-Path $env:APPDATA $id
          $data = Join-Path $env:LOCALAPPDATA $id
          $fixtures = (Resolve-Path desktop\ui\tests\fixtures\webview).Path
          function Run($file, [string[]]$arguments, $minutes) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            # Without the handle taken now, the exit code is gone once the process ends.
            $null = $process.Handle
            if (-not $process.WaitForExit($minutes * 60 * 1000)) {
              $process.Kill()
              throw "$file $arguments did not end within $minutes minutes"
            }
            if ($process.ExitCode -ne 0) { throw "$file $arguments ended with exit code $($process.ExitCode)" }
          }
          # The app this setup installed, with the shortcuts that lead to it.
          function Installed($shortcuts) {
            foreach ($file in 'gelabber.exe', 'gelabber_media.dll', 'icon.png', 'icon.ico', 'README.txt', 'THIRD-PARTY-NOTICES.txt', 'uninstall.exe') {
              if (-not (Test-Path (Join-Path $install $file))) { throw "missing after the install: $file" }
            }
            if (Test-Path (Join-Path $install 'gelabber-desktop.exe')) { throw 'the Tauri app is still installed' }
            $built = Get-FileHash (Join-Path $env:CARGO_TARGET_DIR 'release\gelabber.exe')
            if ((Get-FileHash (Join-Path $install 'gelabber.exe')).Hash -ne $built.Hash) {
              throw 'the installed gelabber.exe is not the one built here'
            }
            $entry = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction SilentlyContinue
            if (-not $entry) { throw 'no entry among the installed apps (uninstall key of the account)' }
            if ($entry.DisplayVersion -ne $version) { throw "the installed apps list version $($entry.DisplayVersion), not $version" }
            "installed: $($entry.DisplayName) $($entry.DisplayVersion) in $install"
            foreach ($shortcut in $shortcuts) {
              if (-not (Test-Path $shortcut)) { throw "no shortcut $shortcut" }
              $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
              if ($target -ne (Join-Path $install 'gelabber.exe')) { throw "$shortcut leads to $target" }
              $item = (New-Object -ComObject Shell.Application).NameSpace((Split-Path $shortcut)).ParseName((Split-Path $shortcut -Leaf))
              $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
              if ($aumid -ne $id) { throw "$shortcut has the AppUserModelId '$aumid', not $id" }
            }
          }
          function Removed {
            Start-Process -FilePath (Join-Path $install 'uninstall.exe') -ArgumentList '/S'
            $left = {
              @($install, $lnk, $desktop, $uninstallKey, "HKCU:\Software\Classes\AppUserModelId\$id") |
                Where-Object { Test-Path -LiteralPath $_ }
            }
            $deadline = (Get-Date).AddMinutes(3)
            while ((& $left) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            $rest = @(& $left)
            if ($rest) { throw "left behind by the uninstaller: $($rest -join ', ')" }
            if (-not (Test-Path -LiteralPath 'HKCU:\Software\Gelabber\Gelabber')) {
              throw "the uninstaller removed the installer's note of the folder without being asked"
            }
          }
          function Listening($port) {
            $client = [Net.Sockets.TcpClient]::new()
            try { $client.Connect('127.0.0.1', $port); $true } catch { $false } finally { $client.Dispose() }
          }
          # Whether a live WebView2 log holds $text yet; Chromium has the logs open for writing.
          function Committed($text) {
            $store = Join-Path $data 'EBWebView\Default\Local Storage\leveldb'
            foreach ($log in @(Get-ChildItem -LiteralPath $store -Filter '*.log' -File -ErrorAction SilentlyContinue)) {
              try {
                $stream = [IO.File]::Open($log.FullName, 'Open', 'Read', 'ReadWrite, Delete')
                $memory = [IO.MemoryStream]::new()
                try { $stream.CopyTo($memory) } finally { $stream.Dispose() }
                if ([Text.Encoding]::Latin1.GetString($memory.ToArray()).Contains($text)) { return $true }
              } catch [IO.IOException] {}
            }
            $false
          }
          # The Tauri app on the fixture page of one server until the page is done, then closed.
          function Fill($port, [string[]]$serveArgs, $phase2) {
            Set-Content -LiteralPath (Join-Path $config 'desktop.json') -Value "{`"server`":`"http://127.0.0.1:$port`"}" -NoNewline
            $done = Join-Path $env:RUNNER_TEMP "webview-done-$port"
            Remove-Item -LiteralPath $done -ErrorAction SilentlyContinue
            $server = Start-Process -FilePath python -ArgumentList (@('-I', (Join-Path $fixtures 'page\serve.py'), $port, $done) + $serveArgs) -PassThru -NoNewWindow
            try {
              # A page that fails to load leaves 0.8.9 on an error page, not its setup.
              $deadline = (Get-Date).AddSeconds(30)
              while (-not (Listening $port) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
              if (-not (Listening $port)) { throw "the fixture server did not listen on port $port" }
              $app = Start-Process -FilePath (Join-Path $install 'gelabber-desktop.exe') -PassThru
              $deadline = (Get-Date).AddMinutes(2)
              while (-not (Test-Path -LiteralPath $done) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
              if (-not (Test-Path -LiteralPath $done)) { throw "the Tauri app did not run the fixture page on port $port" }
              # Chromium rate-limits commits to one a minute, so phase 2 lands about a minute later.
              $deadline = (Get-Date).AddMinutes(2)
              while (-not (Committed $phase2) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
              if (-not (Committed $phase2)) { Write-Warning "phase 2 of port $port is in no log after 2 minutes; the close has to commit it" }
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(60 * 1000)) { $app.Kill(); throw 'the Tauri app did not close' }
              # Only this app's WebView2 processes: their command line names its data folder.
              $webview = { @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Where-Object { $_.CommandLine -like "*$data*" }) }
              $deadline = (Get-Date).AddMinutes(1)
              while ((& $webview) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
              if (& $webview) { throw "the Tauri app's WebView2 did not end" }
            } finally {
              Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            }
          }
          function Migrate($release) {
            $tauri = Join-Path $env:RUNNER_TEMP "gelabber-desktop-$release-setup.exe"
            $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$release"
            Invoke-WebRequest "$base/gelabber-desktop-windows-x64-setup.exe" -OutFile $tauri
            Invoke-WebRequest "$base/gelabber-desktop-windows-x64-setup.exe.sha256" -OutFile "$tauri.sha256"
            if ((Get-FileHash $tauri -Algorithm SHA256).Hash -ne ((Get-Content -Raw "$tauri.sha256") -split '\s+')[0]) {
              throw "the Tauri installer of $release does not match its .sha256"
            }
            Run $tauri '/S' 15
            if (-not (Test-Path (Join-Path $install 'gelabber-desktop.exe'))) { throw "the Tauri app is not in $install" }
            $tauriShortcuts = @($lnk, $desktop | Where-Object { Test-Path $_ })
            if ($tauriShortcuts -notcontains $lnk) { throw 'the Tauri setup made no Start menu shortcut' }
            # 8124 first: a server the user left, with other values.
            $null = New-Item -ItemType Directory -Force $config
            Fill 8124 @('fixed') '"inputGain":0.75'
            Fill 8123 @() '"inputGain":1.5'
            $store = Join-Path $data 'EBWebView\Default\Local Storage\leveldb'
            $files = @(Get-ChildItem -LiteralPath $store -File | Where-Object { $_.Name -eq 'CURRENT' -or $_.Name -like 'MANIFEST-*' -or $_.Extension -in '.log', '.ldb' })
            if (-not ($files | Where-Object { Select-String -LiteralPath $_.FullName -Pattern 'gelabber.media' -SimpleMatch -Quiet })) {
              throw "no gelabber.media in $store"
            }
            $copy = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "webview-fixture-windows\$release")
            $files | Copy-Item -Destination $copy
            $export = Join-Path $config 'legacy-settings.json'
            if ([version]$release.TrimStart('v') -ge [version]'0.8.10') {
              if (-not (Test-Path $export)) { throw "$release wrote no legacy-settings.json" }
              # Only the export can give the values now.
              Remove-Item -Recurse -Force (Join-Path $data 'EBWebView')
            } elseif (Test-Path $export) {
              throw "$release wrote legacy-settings.json"
            }
            # The restarted app imports, then ends by itself once it painted (GELABBER_SMOKE).
            $env:GELABBER_SMOKE = '10'
            Run $setup '/P', '/UPDATE', '/R', '/ARGS', '--server', '"https://gelabber.invalid"' 10
            $restarted = @(Get-Process -Name gelabber -ErrorAction SilentlyContinue)
            if (-not $restarted) { throw 'the update did not start gelabber.exe (/R)' }
            foreach ($process in $restarted) { $null = $process.Handle }
            foreach ($process in $restarted) {
              if (-not $process.WaitForExit(120 * 1000)) { throw 'the restarted gelabber.exe did not end within 2 minutes' }
              if ($process.ExitCode -ne 0) { throw "the restarted gelabber.exe ended with exit code $($process.ExitCode), not 0 (painted)" }
            }
            Remove-Item Env:GELABBER_SMOKE
            python -I (Join-Path $fixtures 'check_import.py') $config
            Installed $tauriShortcuts
            Removed
            Remove-Item -Recurse -Force $config, $data -ErrorAction SilentlyContinue
          }
          $setup = (Resolve-Path gelabber-native-windows-x64-setup.exe).Path
          foreach ($release in $env:TAURI_RELEASES -split '\s+' | Where-Object { $_ }) { Migrate $release }

          Run $setup '/S' 10
          Installed @($lnk, $desktop)
          Run $setup '/S', '/UPDATE' 10
          Installed @($lnk)
          Removed

      # WebView2's store as the step above left it, to compare with the Chromium fixture.
      - name: Upload the WebView2 store
        if: ${{ !cancelled() && steps.native-install.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview-fixture-windows
          path: ${{ runner.temp }}/webview-fixture-windows
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the native app
        if: ${{ !cancelled() && steps.native-installer.outcome == 'success' && steps.native-sign.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gelabber-native-windows-x64
          path: |
            gelabber-native-windows-x64-setup.exe
            gelabber-native-windows-x64-setup.exe.sha256
            gelabber-native-windows-x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

      # The native app on the runner's desktop for a few seconds, as on Linux
      # (GELABBER_SMOKE): exit status 0 once it painted its setup screen.
      - name: Native app smoke test
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $env:GELABBER_CONFIG_DIR = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'native-smoke')).FullName
          $env:GELABBER_SMOKE = '10'
          $app = Start-Process -FilePath (Join-Path $env:CARGO_TARGET_DIR 'release\gelabber.exe') -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(2 * 60 * 1000)) {
            $app.Kill()
            throw 'the native app did not end within 2 minutes'
          }
          if ($app.ExitCode -ne 0) { throw "the native app ended with exit code $($app.ExitCode) instead of painting its setup screen" }

      # What ships, read with dumpbin: the DLL exports gm_* only, holds no
      # OpenH264/FFmpeg H264 code, and no binary needs more than a clean
      # Windows 10/11 has (System32 DLLs, API sets, UCRT; no VC++ runtime, no
      # debug CRT).
      - name: Check and measure the binaries
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $release = Join-Path $env:CARGO_TARGET_DIR 'release'
          $dll = Get-Item (Join-Path $release 'gelabber_media.dll')
          $exe = Get-Item (Join-Path $release 'gelabber.exe')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object | Select-Object -Last 1
          if (-not $dumpbin) { throw 'no dumpbin.exe in the Visual Studio installation' }

          # Rows "ordinal hint RVA name" of the export table.
          $listing = & $dumpbin /nologo /exports $dll.FullName
          $exports = @($listing | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
            })
          $names = $listing | Select-String '^\s+(\d+) number of names' | Select-Object -First 1
          if (-not $names -or $exports.Count -ne [int]$names.Matches[0].Groups[1].Value) {
            $listing
            throw "could not read the export table of gelabber_media.dll ($($exports.Count) names found)"
          }
          $foreign = @($exports | Where-Object { $_ -notmatch '^gm_' })

          function Needs($file) {
            & $dumpbin /nologo /dependents $file |
              ForEach-Object { if ($_ -match '^\s+(\S+\.(dll|drv))\s*$') { $Matches[1].ToLowerInvariant() } } |
              Sort-Object -Unique
          }
          $redistributable = '^(vcruntime|msvcp|msvcr|concrt|vccorlib|vcomp|vcamp|mfc|atl)\d|^ucrtbased\.'
          function Missing($needs, $shipped) {
            $needs | Where-Object {
              $_ -match $redistributable -or -not (
                $_ -match '^(api|ext)-ms-win-' -or $shipped -contains $_ -or
                (Test-Path -LiteralPath (Join-Path $env:SystemRoot "System32\$_")))
            }
          }
          $dllNeeds = @(Needs $dll.FullName)
          $exeNeeds = @(Needs $exe.FullName)
          $dllMissing = @(Missing $dllNeeds @())
          # Windows N lacks mfplat.dll without the Media Feature Pack: the
          # core loads it only when it looks for H264 (/DELAYLOAD).
          $delayed = (& $dumpbin /nologo /dependents $dll.FullName | Out-String) -match '(?s)delay load dependencies:.*\bmfplat\.dll'
          $exeMissing = @(Missing $exeNeeds @('gelabber_media.dll'))

          $content = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($dll.FullName))
          # Names from OpenH264, from libwebrtc's wrappers around it and FFmpeg,
          # and from FFmpeg. "OpenH264" alone is no sign: the encoder factory's
          # type name has it in every build.
          $h264 = @('CWelsH264SVCEncoder', 'WelsInitEncoderExt', 'H264EncoderImpl', 'H264DecoderImpl',
              'libavcodec', 'avcodec_open2', 'third_party/ffmpeg') |
            Where-Object { $content.Contains($_) }

          @(
            '### Native core and app (Windows x64)', '',
            '| file | size | needs |', '|---|---|---|',
            "| gelabber_media.dll | $([math]::Round($dll.Length / 1MB, 1)) MiB | $($dllNeeds -join ', ') |",
            "| gelabber.exe | $([math]::Round($exe.Length / 1MB, 1)) MiB | $($exeNeeds -join ', ') |", '',
            "Exports of gelabber_media.dll: $($exports.Count)"
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $problems = @(
            if ($foreign) { "gelabber_media.dll exports more than gm_*: $($foreign -join ', ')" }
            if ($h264) { "gelabber_media.dll carries H264 code of OpenH264 or FFmpeg: $($h264 -join ', ')" }
            if (-not $dllNeeds -or $exeNeeds -notcontains 'gelabber_media.dll') { 'could not read the dependencies with dumpbin' }
            if ($dllMissing) { "gelabber_media.dll needs what a clean Windows lacks: $($dllMissing -join ', ')" }
            if (-not $delayed) { 'gelabber_media.dll does not delay-load mfplat.dll' }
            if ($exeMissing) { "gelabber.exe needs what a clean Windows lacks: $($exeMissing -join ', ')" }
          )
          if ($problems) {
            # One annotation each: PowerShell folds a long error message.
            $problems | ForEach-Object { "::error::$_" }
            throw "$($problems.Count) of the checks on the binaries failed"
          }

      # The core's tests, built and not yet run: the mediasoup worker they
      # call (a dev-dependency; Meson and C++, some ten minutes) and the test
      # programs. A step of its own, so that the next one knows whether the
      # worker is there.
      - name: Tests of the core with their mediasoup worker (build)
        id: worker
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.core.outcome == 'success' }}
        timeout-minutes: 45
        run: cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --no-run

      # From here on both long builds exist, so a failing run still saves its
      # cache (rust-cache's post step reads this variable).
      - name: Rust cache also from a run that fails from here on
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.worker.outcome == 'success' }}
        run: Add-Content $env:GITHUB_ENV 'CACHE_ON_FAILURE=true'

      # libwebrtc sends from the machine's address, which Windows may not route
      # to 127.0.0.1: probe it, and move the tests' server to the machine's
      # address if needed (GELABBER_TEST_LISTEN_IP).
      - name: Address for the loopback call
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.core.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Whether a datagram from a socket on $from reaches one on $to, and as coming from $from.
          function Reaches($from, $to) {
            $sender = $null
            $receiver = $null
            try {
              $sender = [Net.Sockets.UdpClient]::new([Net.IPEndPoint]::new($from, 0))
              $receiver = [Net.Sockets.UdpClient]::new([Net.IPEndPoint]::new($to, 0))
              $receiver.Client.ReceiveTimeout = 2000
              $null = $sender.Send([byte[]]@(1), 1, [Net.IPEndPoint]$receiver.Client.LocalEndPoint)
              $source = [Net.IPEndPoint]::new([Net.IPAddress]::Any, 0)
              $null = $receiver.Receive([ref]$source)
              Write-Host "UDP from $from to ${to}: arrives, sent by $($source.Address)"
              return $source.Address.Equals($from)
            } catch {
              Write-Host "UDP from $from to ${to}: $($_.Exception.Message)"
              return $false
            } finally {
              if ($sender) { $sender.Dispose() }
              if ($receiver) { $receiver.Dispose() }
            }
          }
          # The address this machine sends from: a UDP socket takes it on when
          # it is connected, without sending anything.
          $own = $null
          $route = [Net.Sockets.UdpClient]::new([Net.Sockets.AddressFamily]::InterNetwork)
          try {
            $route.Connect('192.0.2.1', 9)
            $own = ([Net.IPEndPoint]$route.Client.LocalEndPoint).Address
          } catch {
            Write-Host "no route to tell this machine's address by: $($_.Exception.Message)"
          } finally {
            $route.Dispose()
          }
          $loopback = [Net.IPAddress]::Loopback
          $listen = $null
          if ($own -and -not [Net.IPAddress]::IsLoopback($own)) {
            $there = Reaches $own $loopback
            $back = Reaches $loopback $own
            if ($there -and $back) {
              $listen = $loopback
            } elseif (Reaches $own $own) {
              $listen = $own
            }
          }
          if (-not $listen) {
            '::warning::No address was found that this machine reaches from its own: the tests keep their server on 127.0.0.1'
          } elseif ($listen.Equals($loopback)) {
            'the server of the tests stays on 127.0.0.1'
          } else {
            "the server of the tests listens on ${listen}: 127.0.0.1 is out of reach from there"
            Add-Content $env:GITHUB_ENV "GELABBER_TEST_LISTEN_IP=$listen"
          }

      # The Linux job's call through an in-process mediasoup worker. H264 only
      # where Media Foundation has codecs, so no GELABBER_EXPECT_H264.
      # GELABBER_TEST_SCREEN_MONITOR captures the primary monitor without the
      # picker; the test skips where Windows cannot capture.
      - name: Loopback call against mediasoup 0.29
        id: tests
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 20
        env:
          RUST_BACKTRACE: "1"
          GELABBER_TEST_SCREEN_MONITOR: "1"
        run: cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core -- --nocapture --test-threads=1

      # A native crash ends the test without a word; libwebrtc's log says
      # where it got to, and how far ICE came on the address chosen above.
      # Never fails by itself.
      - name: Loopback call with libwebrtc logs
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        timeout-minutes: 10
        env:
          GELABBER_MEDIA_LOG: "1"
          RUST_BACKTRACE: "1"
          GELABBER_TEST_SCREEN_MONITOR: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --test mediasoup_loopback --test screen_capture -- --nocapture --test-threads=1
          exit 0

      # The core alone, as above: a call with the app would unify other
      # features and rebuild the worker. The empty core directory keeps Clippy's
      # build scripts from compiling the C++ again.
      - name: Clippy
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GELABBER_MEDIA_LIB_DIR = (New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'no-core')).FullName
          cargo clippy --release --locked --manifest-path desktop/Cargo.toml -p gelabber-media-core --all-targets -- -D warnings
          cargo clippy --release --locked --manifest-path desktop/Cargo.toml -p gelabber -p gelabber-ui -p gelabber-call -p gelabber-client --all-targets -- -D warnings

      - name: Format
        if: ${{ !cancelled() && inputs.release_tag == '' && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

  # The pacman repository (Arch/Omarchy): package, signed database, a user's
  # upgrade from the Tauri package, upgrade and removal. Publishing is separate.
  arch-repo:
    name: Arch package and repository
    if: github.event_name != 'pull_request'
    needs: core-linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      # Releases sign with the repository key; everything else with a
      # throwaway key that only this job trusts.
      ARCH_REPO_GPG_KEY: ${{ inputs.release_tag != '' && secrets.ARCH_REPO_GPG_KEY || '' }}
      # 0.8.9 leaves no export (WebKitGTK is read), 0.8.10 exports (only that is read).
      TAURI_RELEASES: v0.8.9 v0.8.10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the native app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gelabber-native-linux-x64

      # The Tauri package as a release up to 0.8 built it: its PKGBUILD at
      # the tag and the tarball attached to the release.
      - name: Download the Tauri package's sources
        run: |
          set -euo pipefail
          for release in $TAURI_RELEASES; do
            mkdir -p "tauri/$release"
            curl -fsSL --retry 3 -o "tauri/$release/PKGBUILD" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${release}/desktop/packaging/arch/PKGBUILD"
            curl -fsSL --retry 3 -o "tauri/$release/gelabber-desktop-linux-x64.tar.gz" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${release}/gelabber-desktop-linux-x64.tar.gz"
          done

      # Xvfb, lavapipe and the X11 libraries winit loads, for the native app's
      # start after its install; Python serves the Tauri app's fixture page.
      - name: Check PKGBUILD and .SRCINFO
        run: |
          pacman -Syu --noconfirm --needed git xorg-server-xvfb xorg-xauth vulkan-swrast \
            libxkbcommon-x11 libxcursor libxrandr libxi python
          useradd -m builder
          cp -r desktop/packaging/arch /tmp/arch && chown -R builder /tmp/arch
          cd /tmp/arch/native
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -

      - name: Build package and repository
        env:
          TAG: ${{ env.RELEASE_TAG }}
          PUBLISH: ${{ vars.ARCH_REPO_PUBLISH }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            # The package must be built from the released source.
            if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
              echo "release $TAG must be built from its tag, not $GITHUB_REF"; exit 1
            fi
            if [ "$PUBLISH" = true ] && [ -z "$ARCH_REPO_GPG_KEY" ]; then
              echo "ARCH_REPO_PUBLISH is on but the ARCH_REPO_GPG_KEY secret is missing"; exit 1
            fi
            # The package gets its version from the tag, the app in it (what
            # media_info reports) from the desktop workspace: the same, or
            # the release is not built.
            app="v$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n1)"
            if [ "$app" != "$TAG" ]; then
              echo "release $TAG: desktop/Cargo.toml, and with it the app, says $app"; exit 1
            fi
            version="$TAG"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gelabber-native-linux-x64.tar.gz"
          else
            # Test builds: the workspace version plus the run number.
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/Cargo.toml | head -n1).r${GITHUB_RUN_NUMBER}"
            url=""
          fi
          desktop/packaging/arch/repo.sh build "$version" gelabber-native-linux-x64.tar.gz site $url
          cp desktop/packaging/arch/README.md site/README.md

      - name: Upgrade from the Tauri package, upgrade and remove like a user
        run: |
          set -euo pipefail
          for release in $TAURI_RELEASES; do
            desktop/packaging/arch/repo.sh test site gelabber-native-linux-x64.tar.gz \
              "tauri/$release/PKGBUILD" "tauri/$release/gelabber-desktop-linux-x64.tar.gz" "$release"
          done

      # The Tauri app's WebKitGTK storage from the step above (repo.sh test).
      - name: Upload the WebKitGTK store
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview-fixture-arch
          path: webview-fixture-arch
          if-no-files-found: warn
          retention-days: 14

      # The repository as built before the upgrade tests added newer pkgrels.
      - name: Rebuild the repository for upload
        if: inputs.release_tag != ''
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          rm -rf site
          desktop/packaging/arch/repo.sh build "$TAG" gelabber-native-linux-x64.tar.gz site \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gelabber-native-linux-x64.tar.gz"
          cp desktop/packaging/arch/README.md site/README.md

      - name: Upload the repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-repo
          path: site
          retention-days: 14
