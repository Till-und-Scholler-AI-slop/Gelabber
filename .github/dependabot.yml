# Keeps the dependencies current: every Monday one PR per ecosystem with all
# its updates (one group, majors included). These PRs go to main and are never
# merged: an agent turns them into one PR against the development line with
# the generated files renewed (.claude/skills/dependency-updates/SKILL.md).
# Every version update waits 7 days after its release, against freshly
# compromised packages; security updates do not wait (the cooldown skips
# them). Majors that need their own migration stay manual (below).
# For grouped security updates GitHub's "Dependabot errors" page says: to
# ignore a dependency, "Configure an `ignore` rule for the dependency", so a
# rule may stop security pull requests too; the rules name versions where
# they can.
version: 2
updates:
  # The workflows pin every action to a commit SHA with its version as a
  # comment (#299, checked by the deployment tests in ci.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to the branch of the toolchain rust-toolchain.toml names; its
      # only tag is v1. It moves by hand with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directories: [/backend, /desktop]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # The one SFU, moved with docs/v0.4-mediasoup-migration.md.
      - dependency-name: mediasoup*
      # DeepFilterNet's libDF, pinned to the commit the strong filter was
      # measured with (GEL-28); moves by hand with that measurement. Whether
      # advisories match a git dependency at all is not documented.
      - dependency-name: deep_filter
      # libDF takes ndarray ^0.15 arrays (desktop/core/src/strong_filter.rs)
      # and builds on tract ^0.21.4. Go when deep_filter moves past them.
      - dependency-name: ndarray
        versions: [">= 0.16"]
      - dependency-name: tract*
        versions: [">= 0.22"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # A major moves together with the mediasoup crate, by hand
      # (docs/v0.4-mediasoup-migration.md); goes with cargo's mediasoup* rule.
      - dependency-name: mediasoup-client
        update-types: [version-update:semver-major]

  # The deployment tests' PyYAML, pinned with hashes (GEL-403).
  - package-ecosystem: pip
    directory: /deploy/compose/tests
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]

  # A merge to main deploys (#427): images move within their major version.
  - package-ecosystem: docker
    directories: [/backend/api, /backend/media, /web, /deploy/compose/minio, /deploy/compose/mc]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The Rust image follows rust-toolchain.toml, by hand.
      - dependency-name: rust

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # Postgres, Redis and the rest take a data migration across majors.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Gelabber's own images move with each release PR.
      - dependency-name: ghcr.io/till-und-scholler-ai-slop/*
