# Keeps the dependencies current: weekly, minor and patch updates in one PR
# per ecosystem, a major version in its own PR. All PRs go to main; sync main
# into the development line afterwards (AGENTS.md).
# Every update waits 7 days after its release, against freshly compromised
# packages. Majors that need their own migration stay manual (below).
version: 2
updates:
  # The workflows pin every action to a commit SHA with its version as a
  # comment (#299, checked by the deployment tests in ci.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Pinned to the branch of the toolchain rust-toolchain.toml names; its
      # only tag is v1. It moves by hand with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directories: [/backend, /desktop]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The one SFU, moved with docs/v0.4-mediasoup-migration.md.
      - dependency-name: mediasoup*

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # A merge to main deploys (#427): images move within their major version.
  - package-ecosystem: docker
    directories: [/backend/api, /backend/media, /web, /deploy/compose/minio, /deploy/compose/mc]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The Rust image follows rust-toolchain.toml, by hand.
      - dependency-name: rust

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Postgres, Redis and the rest take a data migration across majors.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Gelabber's own images move with each release PR.
      - dependency-name: ghcr.io/till-und-scholler-ai-slop/*
