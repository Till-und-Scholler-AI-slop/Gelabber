# The workflows pin every action to a commit SHA with its version as a
# comment (#299, checked by workflow-pins.yml). Dependabot moves the pins and
# comments to new releases, all actions in one weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to the branch of the toolchain rust-toolchain.toml names; its
      # only tag is v1. It moves by hand with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
