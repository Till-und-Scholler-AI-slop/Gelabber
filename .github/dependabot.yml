# Keeps every dependency current: weekly, minor and patch updates in one PR
# per ecosystem, each major version in its own PR. All PRs go to main; sync
# main into the development line afterwards (AGENTS.md).
version: 2
updates:
  # The workflows pin every action to a commit SHA with its version as a
  # comment (#299, checked by the deployment tests in ci.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Pinned to the branch of the toolchain rust-toolchain.toml names; its
      # only tag is v1. It moves by hand with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directories: [/backend, /desktop]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend/api, /backend/media, /web, /deploy/compose/minio, /deploy/compose/mc]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
        update-types: [minor, patch]
