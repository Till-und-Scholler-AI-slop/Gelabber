# Keeps the dependencies current: every Monday one PR per ecosystem with all
# its updates (one group, majors included). These PRs go to main and are never
# merged: an agent turns them into one PR against the development line with
# the generated files renewed (.claude/skills/dependency-updates/SKILL.md).
# Every update waits 7 days after its release, against freshly compromised
# packages. Majors that need their own migration stay manual (below).
# open-pull-requests-limit 3: the groups, not the limit, keep it to one PR a
# week; the limit leaves room for a PR an agent left open (an update that
# broke the build) and the new one that supersedes it. Security updates have
# their own limit and stay single PRs.
version: 2
updates:
  # The workflows pin every action to a commit SHA with its version as a
  # comment (#299, checked by the deployment tests in ci.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Pinned to the branch of the toolchain rust-toolchain.toml names; its
      # only tag is v1. It moves by hand with rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directories: [/backend, /desktop]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # The one SFU, moved with docs/v0.4-mediasoup-migration.md.
      - dependency-name: mediasoup*

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # The deployment tests' PyYAML, pinned with hashes (GEL-403).
  - package-ecosystem: pip
    directory: /deploy/compose/tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]

  # A merge to main deploys (#427): images move within their major version.
  - package-ecosystem: docker
    directories: [/backend/api, /backend/media, /web, /deploy/compose/minio, /deploy/compose/mc]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The Rust image follows rust-toolchain.toml, by hand.
      - dependency-name: rust

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # Postgres, Redis and the rest take a data migration across majors.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Gelabber's own images move with each release PR.
      - dependency-name: ghcr.io/till-und-scholler-ai-slop/*
