[package]
name = "dfn-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "GEL-28: DeepFilterNet3 (libDF + tract) as a plain WebAssembly module, for timing in V8"

# Its own workspace, so cargo does not look for one further up the repository.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# libDF's own "wasm" feature needs wasm-bindgen and its generated JS glue;
# a few C-ABI exports are enough to time the model and need no glue.
deep_filter = { path = "../work/src/deepfilternet/libDF", default-features = false, features = ["tract"] }
ndarray = "0.15.6"
# A dependency seeds hash maps through getrandom, which has no source on
# wasm32-unknown-unknown without JS; lib.rs registers a fixed one.
getrandom = { version = "0.2.14", features = ["custom"] }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
